<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Master ERP — Admin Panel</title>
<meta name="theme-color" content="#1B5FC4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --accent:#1B5FC4; --accent-dim:#1B5FC4; --bg:#EAF3FC; --panel:#FFFFFF; --panel2:#F3F8FF;
  --border:#DCE8F7; --text:#1A2A40; --muted:#7086A3; --success:#18A876; --danger:#E23B54; --warn:#F2A900;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:'Manrope',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; -webkit-font-smoothing:antialiased; padding-top:env(safe-area-inset-top);
}
.mono{font-family:'IBM Plex Mono',monospace;}
.wrap{max-width:960px; margin:0 auto; padding:20px 16px 60px;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; padding:16px 20px;
  background:linear-gradient(135deg,#1B5FC4,#3E9BFF); color:#fff;
}
.topbar h1{font-size:17px; margin:0; font-weight:800;}
.topbar button{background:rgba(255,255,255,0.2); border:none; color:#fff; padding:8px 14px; border-radius:9px; font-weight:700; font-size:12.5px; cursor:pointer;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 4px 14px rgba(27,95,196,0.06);}
input{width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:9px; font-size:14px; font-family:inherit; background:var(--panel2); color:var(--text);}
.btn{border:none; cursor:pointer; font-weight:700; font-size:13.5px; border-radius:10px; padding:11px 18px; color:#fff; background:linear-gradient(180deg,#3E9BFF,#1B5FC4); width:100%;}
.btn-sm{padding:8px 12px; font-size:12px; border-radius:8px; width:auto;}
.btn-danger{background:linear-gradient(180deg,#F0576E,#C22A42);}
.btn-success{background:linear-gradient(180deg,#5CFFB8,#18A876);}
.btn-ghost{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
.badge{display:inline-block; padding:4px 10px; border-radius:20px; font-size:10.5px; font-weight:800; text-transform:uppercase;}
.badge-trial{background:rgba(242,169,0,0.15); color:#B87800;}
.badge-active{background:rgba(24,168,118,0.15); color:var(--success);}
.badge-expired{background:rgba(226,59,84,0.15); color:var(--danger);}
.badge-legacy{background:rgba(122,79,224,0.15); color:#7A4FE0;}
.company-row{border-bottom:1px solid var(--border); padding:14px 0;}
.company-row:last-child{border-bottom:none;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
@media(min-width:520px){ .stat-grid{grid-template-columns:1fr 1fr 1fr 1fr;} }
.stat-box .num{font-size:18px;}
.stat-box{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; text-align:center;}
.stat-box .num{font-size:20px; font-weight:800; color:var(--accent-dim);}
.stat-box .lbl{font-size:10px; color:var(--muted); text-transform:uppercase; font-weight:700; margin-top:2px;}
.loader{text-align:center; padding:40px; color:var(--muted);}
.auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.auth-card{max-width:360px; width:100%; text-align:center;}
.field{margin-bottom:12px; text-align:left;}
.field label{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; display:block; margin-bottom:5px;}
</style>
</head>

<div id="app"></div>

<script>
const SUPABASE_URL = "https://slinhjeuznubblldjjtq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_AhsnGztSJliwyY3QmUiWeQ_UvOU9Kdi";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

/* ============ MUHIM: O'ZINGIZNING MAXFIY PAROLINGIZNI BU YERGA YOZING ============ */
const ADMIN_USERNAME = "Abdurahimov";
const ADMIN_PASSWORD = "1112";
/* Bu parol shu faylning ichida ochiq turadi (chunki bu oddiy statik sahifa) - shuning uchun
   bu havolani hech kimga bermang, faqat o'zingiz ishlating. Buni albatta o'zgartiring! */

let authed = sessionStorage.getItem('admin_authed') === 'yes';

function todayStr(){ return new Date().toISOString().slice(0,10); }
function money(n){ return Number(n||0).toLocaleString('ru-RU'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function generateSalt(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPassword(password, salt){
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(salt+':'+password));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function getSubStatus(companyData){
  const sub = companyData && companyData.settings && companyData.settings.subscription;
  if(!sub) return { label:'Eski (cheklovsiz)', cls:'badge-legacy', daysLeft:null };
  if(sub.status === 'active_paid_forever') return { label:'💎 Butunlay sotib olingan', cls:'badge-legacy', daysLeft:null };
  const today = todayStr();
  if(sub.paidUntil){
    if(sub.paidUntil >= today){
      const d = Math.round((new Date(sub.paidUntil)-new Date(today))/86400000);
      return { label:`Premium (${d} kun)`, cls:'badge-active', daysLeft:d };
    }
    return { label:'Muddati tugagan', cls:'badge-expired', daysLeft:0 };
  }
  if(sub.trialEnd >= today){
    const d = Math.round((new Date(sub.trialEnd)-new Date(today))/86400000);
    return { label:`Sinov (${d} kun)`, cls:'badge-trial', daysLeft:d };
  }
  return { label:'Sinov tugagan', cls:'badge-expired', daysLeft:0 };
}

async function loadCompanies(){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="wrap"><div class="loader">⏳ Yuklanmoqda...</div></div>`;

  // Barcha admin foydalanuvchilarni topamiz (user:... kalitlar ichidan role='admin' bo'lganlar)
  const { data: userRows, error: userErr } = await sb.from('erp_data').select('key,value').like('key', 'user:%');
  if(userErr){ app.innerHTML = `<div class="wrap"><div class="card">⚠️ Xato: ${esc(userErr.message)}</div></div>`; return; }

  const admins = userRows.filter(r => r.value && r.value.role === 'admin');

  // Har bir kompaniya uchun company_data'ni olamiz
  const companies = [];
  for(const row of admins){
    const u = row.value;
    const { data: cdRow } = await sb.from('erp_data').select('value').eq('key', 'company_data:'+u.companyId).maybeSingle();
    const companyData = cdRow ? cdRow.value : null;
    companies.push({ user:u, companyData });
  }

  // Umumiy (barcha ERP mijozlariga ko'rinadigan) to'lov/kontakt sozlamalarini olamiz
  const { data: platRow } = await sb.from('erp_data').select('value').eq('key','platform_settings').maybeSingle();
  const platformSettings = platRow ? platRow.value : { cardNumber:'', cardHolder:'', phone:'', telegram:'' };

  renderDashboard(companies, platformSettings);
}

function renderPlatformSettingsCard(platformSettings){
  return `
    <div class="card" style="border-color:rgba(122,79,224,0.35); background:linear-gradient(180deg,rgba(122,79,224,0.06),var(--panel));">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
        <div style="font-size:20px;">💳</div>
        <div style="font-weight:800; font-size:14.5px;">To'lov va kontakt sozlamalari</div>
      </div>
      <div style="font-size:11px; color:var(--muted); margin-bottom:12px;">Bu yerda kiritilgan ma'lumot BARCHA ERP mijozlarida (to'lov ekrani va "Yordam" bo'limida) avtomatik ko'rinadi.</div>
      <div class="field"><label>Karta raqami</label><input id="ps_card" value="${esc(platformSettings.cardNumber||'')}" placeholder="8600 0000 0000 0000"></div>
      <div class="field"><label>Karta egasi</label><input id="ps_holder" value="${esc(platformSettings.cardHolder||'')}" placeholder="ISM FAMILIYA"></div>
      <div class="field"><label>Telefon</label><input id="ps_phone" value="${esc(platformSettings.phone||'')}" placeholder="+998 90 123 45 67"></div>
      <div class="field"><label>Telegram</label><input id="ps_telegram" value="${esc(platformSettings.telegram||'')}" placeholder="Telegram: @username"></div>
      <button class="btn btn-sm" id="btnSavePlatformSettings" style="width:100%;">Saqlash</button>
    </div>
  `;
}
function bindPlatformSettingsCard(){
  const btn = document.getElementById('btnSavePlatformSettings');
  if(!btn) return;
  btn.onclick = async ()=>{
    const value = {
      cardNumber: document.getElementById('ps_card').value.trim(),
      cardHolder: document.getElementById('ps_holder').value.trim(),
      phone: document.getElementById('ps_phone').value.trim(),
      telegram: document.getElementById('ps_telegram').value.trim()
    };
    const { error } = await sb.from('erp_data').upsert({ key:'platform_settings', value }, { onConflict:'key' });
    if(error){ alert('Xato: '+error.message); return; }
    alert('✅ Saqlandi! Endi barcha mijozlarda shu ma\'lumot ko\'rinadi.');
  };
}

function renderDashboard(companies, platformSettings){
  const app = document.getElementById('app');
  const totalCompanies = companies.length;
  const trialCount = companies.filter(c=>getSubStatus(c.companyData).cls==='badge-trial').length;
  const activeCount = companies.filter(c=>getSubStatus(c.companyData).cls==='badge-active').length;
  const buyoutCount = companies.filter(c=>c.companyData && c.companyData.settings && c.companyData.settings.subscription && c.companyData.settings.subscription.status==='active_paid_forever').length;
  const expiredCount = companies.filter(c=>getSubStatus(c.companyData).cls==='badge-expired').length;

  app.innerHTML = `
    <div class="topbar">
      <h1>🛠️ Master ERP — Admin Panel</h1>
      <button id="btnLogout">Chiqish</button>
    </div>
    <div class="wrap">
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${totalCompanies}</div><div class="lbl">Jami mijoz</div></div>
        <div class="stat-box"><div class="num" style="color:var(--warn);">${trialCount}</div><div class="lbl">Sinovda</div></div>
        <div class="stat-box"><div class="num" style="color:var(--success);">${activeCount}</div><div class="lbl">Premium</div></div>
        <div class="stat-box"><div class="num" style="color:#B98A2F;">${buyoutCount}</div><div class="lbl">💎 Butunlay</div></div>
      </div>
      ${expiredCount>0 ? `<div class="card" style="background:rgba(226,59,84,0.06); border-color:rgba(226,59,84,0.3);"><b style="color:var(--danger);">⚠ ${expiredCount} ta mijozning muddati tugagan</b></div>` : ''}

      ${renderPlatformSettingsCard(platformSettings)}

      <input id="searchBox" placeholder="🔎 Do'kon nomi yoki ism bo'yicha qidirish..." style="margin-bottom:16px; margin-top:16px;">

      <div id="companyList"></div>
    </div>
  `;
  bindPlatformSettingsCard();
  document.getElementById('btnLogout').onclick = ()=>{
    sessionStorage.removeItem('admin_authed');
    location.reload();
  };
  function renderList(filter){
    const q = (filter||'').trim().toLowerCase();
    const filtered = companies.filter(c=>!q || (c.user.companyName||'').toLowerCase().includes(q) || (c.user.fullName||'').toLowerCase().includes(q));
    const listEl = document.getElementById('companyList');
    if(!filtered.length){ listEl.innerHTML = `<div class="card" style="text-align:center; color:var(--muted);">Hech narsa topilmadi</div>`; return; }
    listEl.innerHTML = `<div class="card">` + filtered.map(c=>{
      const st = getSubStatus(c.companyData);
      const productCount = c.companyData ? (c.companyData.products||[]).length : 0;
      const salesCount = c.companyData ? (c.companyData.sales||[]).length : 0;
      return `
        <div class="company-row">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;">
            <div>
              <div style="font-weight:800; font-size:15px;">${esc(c.user.companyName)}</div>
              <div style="font-size:12px; color:var(--muted); margin-top:2px;">${esc(c.user.fullName)} · ${esc(c.user.phone||'')}</div>
              <div style="font-size:11px; color:var(--muted); margin-top:2px;">📦 ${productCount} tovar · 🧾 ${salesCount} sotuv</div>
            </div>
            <span class="badge ${st.cls}">${st.label}</span>
          </div>
          <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
            <button class="btn btn-sm btn-success" data-extend="${c.user.companyId}" data-days="30">1 oy — 100,000</button>
            <button class="btn btn-sm btn-success" data-extend="${c.user.companyId}" data-days="182">6 oy — 600,000</button>
            <button class="btn btn-sm btn-success" data-extend="${c.user.companyId}" data-days="365">12 oy — 1,100,000</button>
            <button class="btn btn-sm" style="background:linear-gradient(180deg,#B98A2F,#7A5A1B); color:#fff;" data-buyout="${c.user.companyId}">💎 Butunlay — 4,000,000</button>
            <button class="btn btn-sm btn-danger" data-block="${c.user.companyId}">Bloklash</button>
            <button class="btn btn-sm btn-ghost" data-toggle-fix="${c.user.companyId}">🔧 Muammoni hal qilish</button>
          </div>
          <div id="fixPanel-${c.user.companyId}" style="display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);"></div>
        </div>
      `;
    }).join('') + `</div>`;

    listEl.querySelectorAll('[data-toggle-fix]').forEach(b=>{
      b.onclick = ()=>{
        const companyId = b.dataset.toggleFix;
        const panel = document.getElementById('fixPanel-'+companyId);
        const isOpen = panel.style.display !== 'none';
        if(isOpen){ panel.style.display = 'none'; panel.innerHTML=''; return; }
        panel.style.display = 'block';
        renderFixPanel(panel, companies.find(c=>c.user.companyId===companyId));
      };
    });
    listEl.querySelectorAll('[data-extend]').forEach(b=>{
      b.onclick = async ()=>{
        const companyId = b.dataset.extend;
        const days = Number(b.dataset.days);
        const company = companies.find(c=>c.user.companyId===companyId);
        if(!company || !company.companyData) return alert('Ma\'lumot topilmadi');
        if(!confirm(`${company.user.companyName} uchun ${days} kunlik Premium beriladi. Davom etilsinmi?`)) return;
        const base = new Date();
        const currentPaidUntil = company.companyData.settings && company.companyData.settings.subscription && company.companyData.settings.subscription.paidUntil;
        if(currentPaidUntil && currentPaidUntil > todayStr()) base.setTime(new Date(currentPaidUntil).getTime());
        base.setDate(base.getDate()+days);
        company.companyData.settings = company.companyData.settings || {};
        company.companyData.settings.subscription = { status:'active', trialEnd: (company.companyData.settings.subscription&&company.companyData.settings.subscription.trialEnd)||todayStr(), paidUntil: base.toISOString().slice(0,10) };
        const { error } = await sb.from('erp_data').upsert({ key:'company_data:'+companyId, value: company.companyData }, { onConflict:'key' });
        if(error){ alert('Xato: '+error.message); return; }
        alert('✅ Muvaffaqiyatli uzaytirildi!');
        loadCompanies();
      };
    });
    listEl.querySelectorAll('[data-buyout]').forEach(b=>{
      b.onclick = async ()=>{
        const companyId = b.dataset.buyout;
        const company = companies.find(c=>c.user.companyId===companyId);
        if(!company || !company.companyData) return alert('Ma\'lumot topilmadi');
        if(!confirm(`${company.user.companyName} ilovani BUTUNLAY (muddatsiz) sotib oladi - 4,000,000 so'm. Tasdiqlaysizmi?`)) return;
        company.companyData.settings = company.companyData.settings || {};
        company.companyData.settings.subscription = { status:'active_paid_forever', trialEnd: (company.companyData.settings.subscription&&company.companyData.settings.subscription.trialEnd)||todayStr(), paidUntil: null };
        const { error } = await sb.from('erp_data').upsert({ key:'company_data:'+companyId, value: company.companyData }, { onConflict:'key' });
        if(error){ alert('Xato: '+error.message); return; }
        alert('💎 Muddatsiz (butunlay) faollashtirildi!');
        loadCompanies();
      };
    });
    listEl.querySelectorAll('[data-block]').forEach(b=>{
      b.onclick = async ()=>{
        const companyId = b.dataset.block;
        const company = companies.find(c=>c.user.companyId===companyId);
        if(!company || !company.companyData) return alert('Ma\'lumot topilmadi');
        if(!confirm(`${company.user.companyName} bloklansinmi? Ular ilovaga kira olmay qoladi.`)) return;
        const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
        company.companyData.settings = company.companyData.settings || {};
        company.companyData.settings.subscription = { status:'expired', trialEnd: yesterday.toISOString().slice(0,10), paidUntil: yesterday.toISOString().slice(0,10) };
        const { error } = await sb.from('erp_data').upsert({ key:'company_data:'+companyId, value: company.companyData }, { onConflict:'key' });
        if(error){ alert('Xato: '+error.message); return; }
        alert('Bloklandi.');
        loadCompanies();
      };
    });
  }
  renderList('');
  document.getElementById('searchBox').oninput = (e)=>renderList(e.target.value);
}

/* Mijozning muammosini hal qilish paneli: parolni tiklash, zaxiradan tiklash, xodimlarni boshqarish */
async function renderFixPanel(panel, company){
  panel.innerHTML = `<div style="text-align:center; color:var(--muted); font-size:12px; padding:10px;">⏳ Yuklanmoqda...</div>`;
  const companyId = company.user.companyId;

  // Xodimlar ro'yxatini olamiz
  const employees = (company.companyData && company.companyData.employees) || [];
  // Avtomatik zaxira bor-yo'qligini tekshiramiz
  const { data: backupRow } = await sb.from('erp_data').select('value').eq('key','company_data_backup:'+companyId).maybeSingle();
  const hasBackup = !!backupRow;

  panel.innerHTML = `
    <div style="font-size:11px; font-weight:800; text-transform:uppercase; color:var(--muted); margin-bottom:10px;">🔧 Muammoni hal qilish — ${esc(company.user.companyName)}</div>

    <div style="margin-bottom:14px;">
      <div style="font-size:12.5px; font-weight:700; margin-bottom:6px;">🔑 Parolni tiklash</div>
      <div style="display:flex; gap:8px;">
        <input type="text" id="newPass-${companyId}" placeholder="Yangi parol (masalan: 2525)" style="flex:1;">
        <button class="btn btn-sm" id="btnResetPass-${companyId}" style="width:auto;">Saqlash</button>
      </div>
      <div style="font-size:10.5px; color:var(--muted); margin-top:4px;">Login: <b class="mono">${esc(company.user.username)}</b> uchun yangi parol qo'yiladi</div>
    </div>

    <div style="margin-bottom:14px;">
      <div style="font-size:12.5px; font-weight:700; margin-bottom:6px;">♻️ Zaxiradan tiklash</div>
      ${hasBackup
        ? `<button class="btn btn-sm btn-ghost" id="btnRestoreBackup-${companyId}" style="width:100%;">Oxirgi avtomatik zaxiradan tiklash</button>`
        : `<div style="font-size:11.5px; color:var(--muted);">Bu mijoz uchun hali avtomatik zaxira mavjud emas</div>`}
    </div>

    <div style="margin-bottom:6px;">
      <div style="font-size:12.5px; font-weight:700; margin-bottom:6px;">👥 Xodimlar (${employees.length})</div>
      ${employees.length ? employees.map(e=>`
        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); font-size:12px;">
          <span>${esc(e.fullName)} <span class="mono" style="color:var(--muted);">(${esc(e.username)})</span></span>
          <button class="btn btn-sm btn-danger" data-del-emp="${esc(e.username)}" data-company="${companyId}" style="width:auto; padding:5px 10px;">✕</button>
        </div>
      `).join('') : `<div style="font-size:11.5px; color:var(--muted);">Xodimlar yo'q</div>`}
    </div>
  `;

  document.getElementById(`btnResetPass-${companyId}`).onclick = async ()=>{
    const newPass = document.getElementById(`newPass-${companyId}`).value.trim();
    if(!newPass || newPass.length<3) return alert('Parol juda qisqa');
    if(!confirm(`${company.user.username} uchun parol "${newPass}" ga o'zgartirilsinmi?`)) return;
    const salt = generateSalt();
    const passwordHash = await hashPassword(newPass, salt);
    const userRow = { ...company.user, passwordHash, salt };
    delete userRow.password;
    const { error } = await sb.from('erp_data').upsert({ key:'user:'+company.user.username, value: userRow }, { onConflict:'key' });
    if(error){ alert('Xato: '+error.message); return; }
    alert('✅ Parol muvaffaqiyatli o\'zgartirildi! Mijozga yangi parolni ayting: '+newPass);
  };

  const restoreBtn = document.getElementById(`btnRestoreBackup-${companyId}`);
  if(restoreBtn) restoreBtn.onclick = async ()=>{
    if(!confirm(`${company.user.companyName} uchun ma'lumot OXIRGI AVTOMATIK ZAXIRADAN tiklansinmi? Bu hozirgi ma'lumotni almashtiradi!`)) return;
    const { error } = await sb.from('erp_data').upsert({ key:'company_data:'+companyId, value: backupRow.value }, { onConflict:'key' });
    if(error){ alert('Xato: '+error.message); return; }
    alert('✅ Ma\'lumot zaxiradan tiklandi!');
    loadCompanies();
  };

  panel.querySelectorAll('[data-del-emp]').forEach(b=>{
    b.onclick = async ()=>{
      const username = b.dataset.delEmp;
      if(!confirm(`Xodim "${username}" o'chirilsinmi?`)) return;
      await sb.from('erp_data').delete().eq('key','user:'+username);
      company.companyData.employees = (company.companyData.employees||[]).filter(e=>e.username!==username);
      const { error } = await sb.from('erp_data').upsert({ key:'company_data:'+companyId, value: company.companyData }, { onConflict:'key' });
      if(error){ alert('Xato: '+error.message); return; }
      alert('Xodim o\'chirildi');
      loadCompanies();
    };
  });
}

  app.innerHTML = `
    <div class="auth-wrap">
      <div class="card auth-card">
        <div style="font-size:40px; margin-bottom:10px;">🛠️</div>
        <h2 style="margin-bottom:6px;">Admin Panel</h2>
        <div style="color:var(--muted); font-size:12.5px; margin-bottom:20px;">Faqat egasi uchun</div>
        <div class="field"><label>Login</label><input type="text" id="adminUser" placeholder="Foydalanuvchi nomi" autocapitalize="off"></div>
        <div class="field"><label>Parol</label><input type="password" id="adminPass" placeholder="Parolni kiriting"></div>
        <button class="btn" id="btnLogin">Kirish</button>
      </div>
    </div>
  `;
  const doLogin = ()=>{
    const uVal = document.getElementById('adminUser').value.trim();
    const pVal = document.getElementById('adminPass').value;
    if(uVal === ADMIN_USERNAME && pVal === ADMIN_PASSWORD){
      sessionStorage.setItem('admin_authed','yes');
      loadCompanies();
    } else {
      alert('Login yoki parol noto\'g\'ri');
    }
  };
  document.getElementById('btnLogin').onclick = doLogin;
  document.getElementById('adminPass').onkeydown = (e)=>{ if(e.key==='Enter') doLogin(); };
  setTimeout(()=>{ try{ document.getElementById('adminUser').focus(); }catch(e){} }, 100);
}

if(authed) loadCompanies(); else renderLogin();
</script>
</body>
