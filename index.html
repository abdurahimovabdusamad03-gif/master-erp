<style>
:root{
  --accent:#3E9BFF;
  --accent-bright:#6FC2FF;
  --accent-dim:#1E6FC9;
  --bg:#EAF3FC;
  --bg2:#F4F9FF;
  --panel:#FFFFFF;
  --panel2:#F3F8FF;
  --border:#DCE8F7;
  --text:#1A2A40;
  --muted:#7086A3;
  --success:#18A876;
  --danger:#E23B54;
  --radius:14px;
}
[data-theme="emerald"]{--accent:#12B87A;--accent-bright:#4EDBA6;--accent-dim:#0B7A50;}
[data-theme="sapphire"]{--accent:#3E9BFF;--accent-bright:#6FC2FF;--accent-dim:#1E6FC9;}
[data-theme="ruby"]{--accent:#FF3E63;--accent-bright:#FF7A93;--accent-dim:#C41E3E;}
[data-theme="gold"]{--accent:#E0A800;--accent-bright:#FFCB3D;--accent-dim:#A87800;}

*{box-sizing:border-box; margin:0; padding:0; font-variant-numeric:tabular-nums;}
html,body{height:100%;}
body{
  background:
    radial-gradient(circle at 15% 0%, rgba(62,155,255,0.10), transparent 45%),
    radial-gradient(circle at 85% 100%, rgba(62,155,255,0.08), transparent 45%),
    var(--bg);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  font-size:14px;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Manrope',sans-serif; letter-spacing:.3px;}
.mono{font-family:'IBM Plex Mono',monospace; font-feature-settings:"tnum" 1; letter-spacing:-0.2px;}
::selection{background:var(--accent); color:#fff;}
a{color:inherit;}
button{font-family:inherit;}
input,select{
  font-family:inherit; color:var(--text); background:var(--panel2);
  border:1px solid var(--border); border-radius:9px; padding:9px 11px; font-size:13.5px; width:100%;
  outline:none; transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(62,155,255,0.18);}
input[type="date"]{color-scheme:light;}
label{font-size:11.5px; color:var(--muted); font-weight:700; letter-spacing:.5px; text-transform:uppercase; display:block; margin-bottom:5px;}
.field{margin-bottom:11px;}

/* ---------- 3D PREMIUM BUTTONS ---------- */
.btn-3d{
  position:relative; border:none; cursor:pointer; font-weight:700; font-size:13px;
  border-radius:10px; padding:10px 16px; color:#fff;
  background:linear-gradient(180deg, var(--accent-bright), var(--accent) 60%, var(--accent-dim));
  box-shadow:
    0 1px 0 rgba(255,255,255,0.5) inset,
    0 -3px 0 rgba(0,0,0,0.15) inset,
    0 5px 0 var(--accent-dim),
    0 8px 14px rgba(62,155,255,0.22);
  transform:translateY(0);
  transition:transform .08s ease, box-shadow .08s ease;
  letter-spacing:.2px;
  text-shadow:0 1px 1px rgba(0,0,0,0.15);
}
.btn-3d:hover{filter:brightness(1.05);}
.btn-3d:active{
  transform:translateY(5px);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.35) inset,
    0 -2px 0 rgba(0,0,0,0.12) inset,
    0 1px 0 var(--accent-dim),
    0 2px 6px rgba(62,155,255,0.25);
}
.btn-ghost{
  border:1px solid var(--border); background:var(--panel2); color:var(--text);
  border-radius:10px; padding:9px 14px; cursor:pointer; font-weight:600; font-size:13px;
  box-shadow:0 3px 8px rgba(62,155,255,0.07);
  transition:transform .08s, border-color .15s;
}
.btn-ghost:hover{border-color:var(--accent);}
.btn-ghost:active{transform:translateY(3px);}
.btn-danger{
  border:none; background:linear-gradient(180deg,#F0707C,var(--danger) 70%,#a8283f);
  color:#fff; border-radius:12px; padding:10px 16px; cursor:pointer; font-weight:700; font-size:13.5px;
  box-shadow:0 4px 0 #a8283f, 0 8px 14px rgba(226,59,84,0.3);
}
.btn-danger:active{transform:translateY(3px); box-shadow:0 1px 0 #a8283f,0 2px 6px rgba(226,59,84,0.3);}
.btn-sm{padding:8px 12px; font-size:12px; border-radius:8px;}

/* ---------- CARDS / PANELS ---------- */
.card{
  background:linear-gradient(180deg, var(--panel), var(--panel2));
  border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:0 6px 20px rgba(62,155,255,0.09), 0 1px 0 rgba(255,255,255,0.6) inset;
  padding:13px;
}
.stat-card{position:relative; overflow:hidden;}
.stat-card::before{
  content:''; position:absolute; top:-40%; right:-20%; width:140px; height:140px; border-radius:50%;
  background:radial-gradient(circle, rgba(62,155,255,0.16), transparent 70%);
}
.stat-num{font-family:'Manrope',sans-serif; font-size:24px; font-weight:800; color:var(--accent-dim); letter-spacing:-.3px; font-feature-settings:"tnum" 1;}
.stat-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.7px; font-weight:700; margin-bottom:5px;}
.stat-green{border-color:rgba(24,168,118,0.30); background:linear-gradient(180deg,rgba(24,168,118,0.06),var(--panel2));} .stat-green .stat-num{color:#0E9B68; font-size:16px; letter-spacing:-.2px;}
.stat-red{border-color:rgba(226,59,84,0.30); background:linear-gradient(180deg,rgba(226,59,84,0.06),var(--panel2));} .stat-red .stat-num{color:#D6304A; font-size:16px; letter-spacing:-.2px;}
.stat-teal{border-color:rgba(24,168,118,0.30); background:linear-gradient(180deg,rgba(24,168,118,0.10),var(--panel2));} .stat-teal .stat-num{color:#0E9B68; font-size:16px; letter-spacing:-.2px;}
.stat-gold{border-color:rgba(224,168,0,0.35); background:linear-gradient(180deg,rgba(224,168,0,0.07),var(--panel2));} .stat-gold .stat-num{color:#B8860B; font-size:16px; letter-spacing:-.2px;}
.stat-blue{border-color:rgba(62,155,255,0.35); background:linear-gradient(180deg,rgba(62,155,255,0.07),var(--panel2));} .stat-blue .stat-num{color:#1E6FC9; font-size:16px; letter-spacing:-.2px;}
.stat-pink{border-color:rgba(226,59,84,0.30); background:linear-gradient(180deg,rgba(226,59,84,0.06),var(--panel2));} .stat-pink .stat-num{color:#C2295A; font-size:16px; letter-spacing:-.2px;}
.net-banner{
  display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 18px;
  border-radius:14px; background:linear-gradient(135deg,#1B5FC4,#3E9BFF);
  border:1px solid var(--border); box-shadow:0 8px 20px rgba(62,155,255,0.22);
  font-weight:700; font-size:13.5px; color:#fff;
}
.net-banner-num{color:#fff; font-size:18px; font-weight:800; letter-spacing:-.3px;}

/* ---------- LAYOUT ---------- */
#app{min-height:100vh; display:flex; flex-direction:column;}
.auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; padding-top:calc(24px + env(safe-area-inset-top));}
.auth-card{width:100%; max-width:420px;}
.logo-mark{
  width:52px;height:52px;border-radius:14px; margin:0 auto 18px;
  background:linear-gradient(135deg, var(--accent-bright), var(--accent-dim));
  display:flex; align-items:center; justify-content:center; font-family:'Manrope',sans-serif;
  font-weight:700; font-size:26px; color:#fff;
  box-shadow:0 8px 20px rgba(62,155,255,0.3), 0 2px 0 rgba(255,255,255,0.4) inset;
}
.tabbar{display:flex; gap:6px; background:var(--panel2); border-radius:12px; padding:5px; margin-bottom:22px; border:1px solid var(--border);}
.tabbar button{flex:1; background:transparent; border:none; color:var(--muted); padding:10px; border-radius:9px; font-weight:700; font-size:13.5px; cursor:pointer;}
.tabbar button.active{background:linear-gradient(180deg,var(--accent-bright),var(--accent)); color:#fff; box-shadow:0 4px 10px rgba(62,155,255,0.25);}
.active-pm{background:linear-gradient(180deg,var(--accent-bright),var(--accent)) !important; color:#fff !important; border-color:var(--accent) !important;}

.shell{display:flex; flex:1; min-height:100vh;}
.sidebar{
  width:230px; background:linear-gradient(180deg,var(--panel),var(--bg2)); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:18px 14px; gap:3px; flex-shrink:0;
}
.brand{display:flex; align-items:center; gap:10px; padding:0 6px 18px; border-bottom:1px solid var(--border); margin-bottom:12px;}
.brand .logo-mark{margin:0; width:38px; height:38px; font-size:18px; border-radius:10px;}
.brand-txt div:first-child{font-family:'Manrope',sans-serif; font-weight:700; font-size:19px;}
.brand-txt div:last-child{font-size:10.5px; color:var(--muted); letter-spacing:1.5px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 13px; border-radius:9px; cursor:pointer;
  color:var(--muted); font-weight:600; font-size:13.5px; transition:background .12s,color .12s; border:1px solid transparent;
}
.nav-item:hover{background:var(--panel2); color:var(--text);}
.nav-item.active{background:rgba(62,155,255,0.12); color:var(--accent-dim); border-color:rgba(62,155,255,0.3);}
.nav-icon{width:20px; text-align:center;}
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; padding:13px 22px;
  padding-top:calc(13px + env(safe-area-inset-top));
  border-bottom:1px solid var(--border); background:rgba(255,255,255,0.75); backdrop-filter:blur(8px);
  position:sticky; top:0; z-index:10;
}
.content{padding:20px 22px 96px; flex:1;}
.page-title{font-family:'Manrope',sans-serif; font-size:20px; font-weight:800; margin-bottom:2px; letter-spacing:-.2px;}
.page-sub{color:var(--muted); font-size:12px; margin-bottom:12px;}
.grid{display:grid; gap:12px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(3,1fr);}}

table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{text-align:left; color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; padding:8px 10px; border-bottom:1px solid var(--border);}
td{padding:10px; border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.02);}
.badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.3px;}
.badge-success{background:rgba(57,184,137,0.15); color:var(--success);}
.badge-muted{background:rgba(138,147,172,0.15); color:var(--muted);}
.badge-accent{background:rgba(62,155,255,0.14); color:var(--accent-dim);}

.modal-bg{position:fixed; inset:0; background:rgba(26,42,64,0.35); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal{width:100%; max-width:440px; max-height:88vh; overflow:auto;}

.bottom-nav{display:none;}
.swatch{width:38px; height:38px; border-radius:50%; cursor:pointer; border:3px solid transparent;}
.swatch.selected{border-color:#fff;}
.lang-btn{padding:10px 18px;}
.empty-state{text-align:center; padding:36px 18px; color:var(--muted); font-size:13px;}
.empty-state .em-icon{font-size:28px; margin-bottom:8px; opacity:.6;}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--accent); color:var(--text); padding:11px 20px; border-radius:10px; font-size:13px; font-weight:600; z-index:200; box-shadow:0 10px 25px rgba(62,155,255,0.15); max-width:88vw;}

@media(max-width:820px){
  .sidebar{display:none;}
  .content{padding:10px 8px 118px;}
  .grid-4{grid-template-columns:repeat(2,1fr); gap:7px;}
  .grid-3{grid-template-columns:repeat(2,1fr); gap:7px;}
  .grid-2{grid-template-columns:1fr; gap:7px;}
  .topbar{padding:9px 10px; padding-top:calc(9px + env(safe-area-inset-top));}
  .card{padding:10px; border-radius:11px;}
  .page-title{font-size:17px;}
  .page-sub{font-size:11px; margin-bottom:10px;}
  .stat-card{padding:9px !important;}
  .stat-num{font-size:17px;}
  .stat-label{font-size:9px;}
  table{font-size:11px;}
  th{padding:6px 6px; font-size:9px;}
  td{padding:7px 6px;}
  .btn-3d{padding:9px 13px; font-size:12px; border-radius:9px;}
  .btn-ghost{padding:8px 11px; font-size:11.5px; border-radius:9px;}
  .btn-sm{padding:6px 9px; font-size:11px;}
  input,select{padding:8px 10px; font-size:13px;}
  .field{margin-bottom:9px;}
  label{font-size:10px; margin-bottom:4px;}
  .modal{max-width:100%;}
  .tabbar{padding:4px;}
  .tabbar button{padding:7px; font-size:11.5px;}
  .brand-txt div:first-child{font-size:16px;}
  .bottom-nav{
    display:flex; justify-content:space-evenly; position:fixed; bottom:0; left:0; right:0;
    background:linear-gradient(180deg, var(--panel), var(--panel2));
    border-top:1px solid var(--border);
    z-index:50; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(62,155,255,0.15);
  }
  .bn-item{flex:1 1 0; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted); font-size:8.8px; font-weight:700; cursor:pointer; padding:5px 1px; border-radius:10px; transition:background .12s,color .12s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:90px;}
  .bn-scan-connector{
    position:absolute; left:50%; top:-9px; transform:translateX(-50%);
    width:6px; height:10px; border-radius:3px 3px 0 0;
    background:linear-gradient(180deg,#1B5FC4,#0D3E85);
  }
  .bn-scan-fab{
    position:absolute; left:50%; top:-83px; transform:translateX(-50%);
    width:74px; height:74px; border-radius:50%; border:4px solid var(--panel);
    background:linear-gradient(180deg,#6FC2FF,#1B5FC4 60%,#0D3E85);
    color:#fff; font-size:30px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 22px rgba(27,95,196,0.5), 0 2px 0 rgba(255,255,255,0.35) inset;
    cursor:pointer; z-index:6;
  }
  .bn-scan-fab:active{transform:translateX(-50%) scale(0.94);}
  .bn-item.active{color:var(--accent-dim); background:rgba(62,155,255,0.12);}
  .bn-icon{font-size:17px; line-height:1;}
}
@media(max-width:420px){
  .grid-4{grid-template-columns:repeat(2,1fr); gap:6px;}
  .stat-card{padding:8px !important;}
  .stat-num{font-size:15px;}
  .content{padding:8px 6px 114px;}
  .card{padding:9px; border-radius:10px;}
  th,td{padding:5px 4px;}
  .page-title{font-size:16px;}
}
</style>

const todayStr = ()=> new Date().toISOString().slice(0,10);
const APP_VERSION = "2026-08-17-b"; // Har safar yangi kod yuborilganda bu qiymat oshiriladi (versiya tekshiruvi uchun)
let updateAvailable = false;
let state = { lang:'uz', theme:'sapphire', session:null, page:'dashboard', partnerTab:'customers', currency:'uzs', dateFrom: todayStr(), dateTo: todayStr() };

/* GitHub'ga yangi fayl yuklangandan keyin ba'zan brauzer/qurilma eski nusxani keshda saqlab qolishi mumkin.
   Shu sababli joriy sahifadagi versiyani jonli saytdagi versiya bilan solishtiramiz - agar farq bo'lsa,
   foydalanuvchiga "Yangi versiya bor" deb ko'rsatamiz. */
async function checkForUpdate(manual){
  try{
    const res = await fetch(window.location.pathname, { cache:'no-store' });
    if(!res.ok){ if(manual) toast('⚠️ ' + t('check_update_failed')); return; }
    const html = await res.text();
    const match = html.match(/APP_VERSION\s*=\s*"([^"]+)"/);
    if(match && match[1] && match[1] !== APP_VERSION){
      updateAvailable = true;
      if(state.page==='settings') render();
    } else if(manual){
      toast('✅ ' + t('already_latest'));
    }
  }catch(e){
    if(manual) toast('⚠️ ' + t('check_update_failed'));
  }
}
function reloadForUpdate(){
  window.location.href = window.location.pathname + '?_v=' + Date.now();
}
let FX_RATE = 12700; // 1 USD kursi - Sozlamalar/Dashboard orqali o'zgartiriladi va saqlanadi
function fmtMoney(n){
  n = Number(n||0);
  if(state.currency==='usd') return '$ ' + (n/FX_RATE).toLocaleString('en-US',{maximumFractionDigits:2});
  return money(n) + ' UZS';
}

/* ============ STORAGE HELPERS (Firebase Firestore + localStorage) ============ */
/* shared=true  -> Firestore (barcha qurilmalar/foydalanuvchilar uchun umumiy, doimiy saqlanadi)
   shared=false -> localStorage (faqat shu qurilma/brauzerga xos - sessiya, til, mavzu kabi) */
let memoryStore = {};
let usingMemoryFallback = false;
function memKey(key, shared){ return (shared?'shared:':'personal:')+key; }
function safeDocId(key){ return key.replace(/\//g,'__SLASH__'); }

async function sGet(key, shared){
  const mk = memKey(key, shared);
  if(!shared){
    try{
      const v = localStorage.getItem('lm_'+key);
      return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  }
  try{
    await window.__sbReadyPromise;
    const { data, error } = await window.__sb.from('erp_data').select('value').eq('key', key).maybeSingle();
    if(error) throw error;
    if(data) return data.value;
    if(mk in memoryStore) return memoryStore[mk];
    return null;
  }catch(e){
    console.error('supabase get error', e);
    if(mk in memoryStore) return memoryStore[mk];
    return null;
  }
}
let lastSupabaseError = null;
async function sSetOnce(key, value, shared){
  if(!shared){
    try{ localStorage.setItem('lm_'+key, JSON.stringify(value)); return true; }
    catch(e){ return false; }
  }
  try{
    await window.__sbReadyPromise;
    const { error } = await window.__sb.from('erp_data').upsert({ key, value }, { onConflict:'key' });
    if(error) throw error;
    return true;
  }catch(e){
    lastSupabaseError = (e && (e.message || e.details || e.hint)) || String(e);
    console.error('supabase set error', e);
    return false;
  }
}
async function sSet(key, value, shared, attempts=4){
  for(let i=0;i<attempts;i++){
    const ok = await sSetOnce(key, value, shared);
    if(ok) return true;
    if(i<attempts-1) await new Promise(r=>setTimeout(r, 350*(i+1))); // ortib boruvchi kutish (backoff)
  }
  // Barcha urinishlar muvaffaqiyatsiz - bu haqiqiy MUAMMO, foydalanuvchini albatta ogohlantiramiz
  // (xotiraga vaqtincha saqlaymiz, lekin bu sahifa yopilsa YO'QOLADI - shuning uchun success deb ko'rsatmaymiz)
  memoryStore[memKey(key, shared)] = value;
  toast('⚠️ ' + t('save_failed_detail') + (lastSupabaseError ? ': '+lastSupabaseError.slice(0,80) : ''));
  return false;
}
async function sDel(key, shared){
  if(!shared){
    try{ localStorage.removeItem('lm_'+key); }catch(e){}
    return;
  }
  try{
    await window.__sbReadyPromise;
    await window.__sb.from('erp_data').delete().eq('key', key);
  }catch(e){ console.error('supabase delete error', e); }
  delete memoryStore[memKey(key, shared)];
}

/* Do'kon logosi va nomini sahifa sarlavhasi/Bosh ekran belgisiga (Add to Home Screen) dinamik joylashtiradi.
   iOS "Bosh ekranga qo'shish" bosilgan paytdagi <title> va apple-touch-icon'ni oladi - shuning uchun
   foydalanuvchi tizimga kirib, logo/nom sozlangandan keyin "Bosh ekranga qo'shish" qilsa, o'sha aniq
   logo va nom bilan chiqadi. */
function updateAppIdentity(data){
  try{
    const companyName = (state.session && state.session.companyName) || 'Master ERP';
    document.title = companyName;

    let titleTag = document.getElementById('appTitleTag');
    if(!titleTag){
      titleTag = document.createElement('meta');
      titleTag.id = 'appTitleTag';
      titleTag.name = 'apple-mobile-web-app-title';
      document.head.appendChild(titleTag);
    }
    titleTag.setAttribute('content', companyName);

    const logo = data.settings && data.settings.logo;
    if(logo){
      let touchIcon = document.querySelector('link[rel="apple-touch-icon"]');
      if(!touchIcon){
        touchIcon = document.createElement('link');
        touchIcon.rel = 'apple-touch-icon';
        document.head.appendChild(touchIcon);
      }
      touchIcon.href = logo;
      let favicon = document.querySelector('link[rel="icon"]');
      if(favicon) favicon.href = logo;
    }
  }catch(e){ console.error('updateAppIdentity error', e); }
}

function genPass(){ const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let p=''; for(let i=0;i<8;i++) p+=c[Math.floor(Math.random()*c.length)]; return p; }
function compressImage(file, maxSize=180, quality=0.55){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
        else { if(h>maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> resolve('');
      img.src = reader.result;
    };
    reader.onerror = ()=> resolve('');
    reader.readAsDataURL(file);
  });
}

let lastToastMsg = '', lastToastAt = 0;
function toast(msg){
  const now = Date.now();
  if(msg===lastToastMsg && now-lastToastAt < 2500) return; // bir xil xabar ustma-ust chiqmasin
  lastToastMsg = msg; lastToastAt = now;
  document.querySelectorAll('.toast').forEach(el=>el.remove()); // eski toastlarni tozalash
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>{ if(el.parentNode) el.remove(); }, 2800);
}

async function getCompanyData(companyId){
  const d = await sGet('company_data:'+companyId, true);
  const base = d || { sales:[], products:[], partners:[], employees:[], expenses:[], telegramConfig:{token:'',chatId:'',enabled:false}, settings:{autoReceipt:true}, purchases:[], partnerStores:[] };
  if(!base.purchases) base.purchases = [];
  if(!base.partnerStores) base.partnerStores = [];
  if(!base.partners) base.partners = [];
  if(!base.products) base.products = [];
  if(!base.sales) base.sales = [];
  if(!base.employees) base.employees = [];
  return base;
}
async function saveCompanyData(companyId, data){
  if(!data.expenses) data.expenses = [];
  if(!data.telegramConfig) data.telegramConfig = {token:'',chatId:'',enabled:false};
  if(!data.settings) data.settings = {autoReceipt:true};
  if(!data.partnerStores) data.partnerStores = [];
  if(!data.purchases) data.purchases = [];

  const payload = JSON.stringify(data);
  if(payload.length > 4200000){
    // 5MB chegaradan xavfsiz masofa - juda katta bo'lsa saqlamaymiz, aks holda butun ma'lumot buziladi
    toast('⚠️ ' + t('payload_too_large'));
    return false;
  }

  let ok = await sSet('company_data:'+companyId, data, true);
  if(!ok) toast('⚠️ '+t('save_failed'));
  return ok;
}
function genBarcode(){
  let d = '2'; // ichki (mahalliy) barcode prefiksi
  for(let i=0;i<11;i++) d += Math.floor(Math.random()*10);
  let sum=0;
  for(let i=0;i<d.length;i++) sum += Number(d[i]) * (i%2===0?1:3);
  const check = (10 - (sum%10))%10;
  return d + check;
}

/* ============ BARCODE SCANNER (html5-qrcode - keng tarqalgan, sinovdan o'tgan, barcha brauzer/qurilmalarda ishonchli ishlaydi) ============ */
let html5QrLoadPromise = null;
function loadHtml5Qrcode(){
  if(window.Html5Qrcode) return Promise.resolve(true);
  if(html5QrLoadPromise) return html5QrLoadPromise;
  html5QrLoadPromise = new Promise((resolve)=>{
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
    script.onload = ()=> resolve(!!window.Html5Qrcode);
    script.onerror = ()=> resolve(false);
    document.head.appendChild(script);
    setTimeout(()=> resolve(!!window.Html5Qrcode), 6000);
  });
  return html5QrLoadPromise;
}

let activeHtml5Qr = null;
async function openBarcodeScanner(onDetect){
  openModal(`
    <h3 style="margin-bottom:10px;">📷 ${t('scanner_title')}</h3>
    <div id="scanStatus" style="font-size:12.5px; color:var(--muted); margin-bottom:12px;">⏳ ${t('loading')}</div>
    <div id="html5qr-reader" style="width:100%; border-radius:12px; overflow:hidden; background:#000; min-height:200px;"></div>
    <div id="scanFoundBox" style="display:none; background:rgba(24,168,118,0.1); border:2px solid var(--success); border-radius:10px; padding:14px; margin-top:14px; text-align:center;">
      <div style="font-size:11px; color:var(--success); font-weight:700; text-transform:uppercase; margin-bottom:6px;">✅ ${t('code_found')}</div>
      <div id="scanFoundValue" class="mono" style="font-size:20px; font-weight:800; letter-spacing:1px; margin-bottom:12px;"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn-3d" id="m_confirm_found" style="flex:1; background:linear-gradient(180deg,#5CFFB8,#18A876 60%,#0B7A50);">✓ ${t('confirm_use')}</button>
        <button class="btn-ghost" id="m_reject_found" style="flex:1;">↺ ${t('scan_again')}</button>
      </div>
    </div>
    <div id="manualEntryBox" style="border:2px dashed var(--accent); border-radius:10px; padding:14px; margin-top:14px; background:rgba(62,155,255,0.06);">
      <label style="color:var(--accent-dim);">⌨️ ${t('manual_entry')}</label>
      <div style="display:flex; gap:8px;">
        <input id="manualBarcode2" placeholder="${t('enter_barcode')}" style="flex:1;" autofocus>
        <button class="btn-3d btn-sm" id="m_manual_ok">✓ ${t('save')}</button>
      </div>
    </div>
    <button class="btn-ghost" id="m_stop" style="width:100%; margin-top:14px;">✕ ${t('stop_scan')}</button>
  `);
  const statusEl = document.getElementById('scanStatus');
  const manualInput = document.getElementById('manualBarcode2');
  setTimeout(()=>{ try{ manualInput.focus(); }catch(e){} }, 150);

  let stopped = false;
  let paused = false;

  async function stopScan(){
    if(stopped) return;
    stopped = true;
    if(activeHtml5Qr){
      try{ await activeHtml5Qr.stop(); }catch(e){}
      try{ activeHtml5Qr.clear(); }catch(e){}
      activeHtml5Qr = null;
    }
    closeModal();
  }
  document.getElementById('m_stop').onclick = stopScan;
  document.getElementById('m_manual_ok').onclick = ()=>{
    const v = manualInput.value.trim();
    if(!v) return toast(t('fill_all'));
    stopScan();
    onDetect(v);
  };
  manualInput.onkeydown = (e)=>{
    if(e.key==='Enter'){ document.getElementById('m_manual_ok').click(); }
  };

  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    statusEl.innerHTML = `⚠️ ${t('scanner_not_supported')}`;
    statusEl.style.color = 'var(--danger)';
    return;
  }

  statusEl.textContent = '⏳ ' + t('loading');
  const ok = await loadHtml5Qrcode();
  if(stopped) return;
  if(!ok || !window.Html5Qrcode){
    statusEl.innerHTML = `⚠️ ${t('scanner_not_supported')}`;
    statusEl.style.color = 'var(--danger)';
    return;
  }

  try{
    statusEl.textContent = '🎥 ' + t('scanner_hint') + '...';
    const formatsToSupport = [
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.QR_CODE
    ];
    activeHtml5Qr = new Html5Qrcode('html5qr-reader', { formatsToSupport, verbose:false });
    await activeHtml5Qr.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 160 }, aspectRatio: 1.4 },
      (decodedText)=>{
        if(stopped || paused) return;
        paused = true; // yana kod topilib, ekranni "chayqalib" ketmasligi uchun
        try{ activeHtml5Qr.pause(true); }catch(e){}
        document.getElementById('scanFoundValue').textContent = decodedText;
        document.getElementById('scanFoundBox').style.display = 'block';
        document.getElementById('manualEntryBox').style.display = 'none';
        document.getElementById('m_confirm_found').onclick = ()=>{
          stopScan();
          onDetect(decodedText);
        };
        document.getElementById('m_reject_found').onclick = ()=>{
          document.getElementById('scanFoundBox').style.display = 'none';
          document.getElementById('manualEntryBox').style.display = 'block';
          paused = false;
          try{ activeHtml5Qr.resume(); }catch(e){}
        };
      },
      ()=>{ /* har bir kadrda kod topilmasa shu yerga tushadi - normal holat, e'tibor bermaymiz */ }
    );
    if(!stopped){ statusEl.textContent = '🟢 ' + t('scanner_hint'); statusEl.style.color = 'var(--success)'; }
  }catch(camErr){
    console.error('html5-qrcode start error', camErr);
    statusEl.innerHTML = `⚠️ ${t('camera_denied')}`;
    statusEl.style.color = 'var(--danger)';
  }
}

/* Kunlik kassa yopish hisoboti - bugungi savdo, to'lovlar, foyda, rasxod va sotilgan tovarlarni Telegram'ga yuboradi */
function buildDailyReportText(data, dateStr){
  const sales = data.sales.filter(s=>s.date===dateStr);
  const expenses = (data.expenses||[]).filter(e=>e.date===dateStr);
  const kassaTushum = sales.reduce((s,x)=>s+Number(x.total||0),0);
  const rasxod = expenses.reduce((s,x)=>s+Number(x.amount||0),0);
  const sofKassa = kassaTushum - rasxod;
  const naqd = sales.reduce((s,x)=>s+Number(x.naqdAmount||0),0);
  const karta = sales.reduce((s,x)=>s+Number(x.kartaAmount||0),0);
  const nasiya = sales.reduce((s,x)=>s+Number(x.nasiyaAmount||0),0);
  const sofFoyda = sales.filter(x=>Number(x.nasiyaAmount||0)<=0 || x.paid).reduce((s,x)=>{
    const itemProfit = (x.items||[]).reduce((s2,it)=>{
      const prod = data.products.find(p=>p.id===it.productId || p.name===it.productName);
      const cost = prod ? (prod.costCurrency==='usd' ? Number(prod.cost||0)*FX_RATE : Number(prod.cost||0)) : 0;
      return s2 + (Number(it.price||0)-cost) * Number(it.qty||0);
    },0);
    return s + itemProfit;
  },0) - rasxod;

  const prodMap = {};
  sales.forEach(s=>{
    (s.items||[]).forEach(it=>{
      if(!prodMap[it.productName]) prodMap[it.productName] = { qty:0, unit:it.unit||'' };
      prodMap[it.productName].qty += Number(it.qty||0);
    });
  });
  const soldLines = Object.entries(prodMap).sort((a,b)=>b[1].qty-a[1].qty);

  const lines = [
    `🔒 *KUNLIK KASSA HISOBOTI*`,
    `📅 ${dateStr}`,
    `🏪 ${state.session.companyName}`,
    ``,
    `💵 Umumiy savdo: *${money(kassaTushum)} UZS*`,
    `📉 Rasxodlar: ${money(rasxod)} UZS`,
    `💰 Sof kassa: *${money(sofKassa)} UZS*`,
    `📈 Sof foyda: *${money(sofFoyda)} UZS*`,
    ``,
    `*To'lovlar bo'yicha:*`,
    `💴 Naqd: ${money(naqd)} UZS`,
    `💳 Karta: ${money(karta)} UZS`,
    `📝 Nasiya: ${money(nasiya)} UZS`,
    `🧾 Sotuvlar soni: ${sales.length} ta`,
  ];
  if(expenses.length){
    lines.push(``, `*Rasxodlar:*`);
    expenses.forEach(e=>lines.push(`• ${e.name} — ${money(e.amount)} UZS`));
  }
  if(soldLines.length){
    lines.push(``, `*Sotilgan tovarlar:*`);
    soldLines.forEach(([name,v])=>lines.push(`• ${name} — ${v.qty}${v.unit}`));
  } else {
    lines.push(``, `_Bugun hech narsa sotilmadi_`);
  }
  return lines.join('\n');
}

async function sendTelegramText(cfg, text){
  const chatIds = String(cfg.chatId).split(/[,\s\n]+/).map(s=>s.trim()).filter(Boolean);
  let anyOk = false;
  for(const cid of chatIds){
    try{
      const res = await fetch(`https://api.telegram.org/bot${cfg.token}/sendMessage`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ chat_id: cid, text, parse_mode:'Markdown' })
      });
      if(res.ok) anyOk = true;
    }catch(e){}
  }
  return anyOk;
}

async function sendTelegramNotification(data, sale){
  const cfg = data.telegramConfig;
  if(!cfg || !cfg.enabled || !cfg.token || !cfg.chatId) return;
  const lines = [
    `🧾 *Yangi sotuv* — ${sale.invoiceNo}`,
    `👤 ${sale.customer || 'Oddiy xaridor'}`,
    ...(sale.items||[]).map(i=>`• ${i.productName} × ${i.qty}${i.unit} — ${money(i.total)}`),
    `💰 Jami: ${money(sale.total)} UZS`,
    `📅 ${sale.date}`
  ];
  const text = lines.join('\n');
  const ok = await sendTelegramText(cfg, text);
  if(ok) toast(t('telegram_sent')); else toast(t('telegram_failed'));
}

/* ============ AUTH ============ */
async function registerCompany(companyName, firstName, lastName, phone, username, password){
  try{
    username = username.trim().toLowerCase();
    const fullName = (firstName.trim()+' '+lastName.trim()).trim();
    if(!companyName || !firstName || !lastName || !phone || !username || !password) return toast(t('fill_all'));
    const existing = await sGet('user:'+username, true);
    if(existing) return toast(t('user_exists'));
    const companyId = uid();
    const userObj = { username, password, fullName, firstName, lastName, phone, role:'admin', companyId, companyName };
    const ok1 = await sSet('user:'+username, userObj, true);
    if(!ok1){ toast('⚠️ '+t('save_failed')); return; }
    await sSet('phone:'+phone, username, true);
    const ok2 = await saveCompanyData(companyId, { sales:[], products:[], partners:[], partnerStores:[], employees:[], expenses:[], purchases:[], telegramConfig:{token:'',chatId:'',enabled:false}, settings:{autoReceipt:true} });
    if(!ok2){ await sDel('user:'+username, true); await sDel('phone:'+phone, true); toast('⚠️ '+t('save_failed')); return; }
    await sSet('session', { username }, false);
    state.session = userObj;
    await render();
  }catch(e){ console.error('registerCompany error', e); toast('⚠️ '+t('save_failed')); }
}

async function loginUser(identifier, password){
  try{
    identifier = identifier.trim().toLowerCase();
    if(!identifier || !password) return toast(t('fill_all'));
    let username = identifier;
    // Agar telefon raqamiga o'xshasa (faqat raqam va +), shu telefonga bog'langan loginni topamiz
    if(/^[+0-9\s-]{6,}$/.test(identifier)){
      const mapped = await sGet('phone:'+identifier.replace(/\s/g,''), true);
      if(mapped) username = mapped;
    }
    const u = await sGet('user:'+username, true);
    if(!u || u.password !== password) return toast(t('wrong_login'));
    await sSet('session', { username }, false);
    state.session = u;
    await render();
  }catch(e){ console.error('loginUser error', e); toast('⚠️ '+t('save_failed')); }
}

async function logout(){
  await sDel('session', false);
  state.session = null;
  state.page='dashboard';
  render();
}

async function tryRestoreSession(){
  try{
    const s = await sGet('session', false);
    if(s && s.username){
      const u = await sGet('user:'+s.username, true);
      if(u) state.session = u;
    }
    const prefs = await sGet('device_prefs', false);
    if(prefs){ state.lang = prefs.lang || 'uz'; state.theme = prefs.theme || 'sapphire'; }
  }catch(e){ console.error('tryRestoreSession error', e); }
}

/* ---- KO'P QURILMALI JONLI SAVAT SINXRONIZATSIYASI ----
   Telefon va noutbuk (yoki bir nechta xodim) bir xil "faol savat"ni ko'rishi uchun:
   savat o'zgarganda Supabase'ga yoziladi, va Sotuv sahifasi ochiq boâ€™lgan boshqa qurilmalar
   buni davriy tekshirib (poll), o'z ekranini yangilab turadi. */
let myDeviceId = (function(){
  try{
    let id = localStorage.getItem('device_id_v1');
    if(!id){ id = uid(); localStorage.setItem('device_id_v1', id); }
    return id;
  }catch(e){ return uid(); }
})();
let cartSyncInterval = null;
let cartSyncActivePage = null;
let cartPushTimer = null;
let lastCartSyncAt = 0;

function activeCartKey(companyId){ return 'active_cart:'+companyId; }

function pushActiveCart(companyId){
  if(!companyId) return;
  clearTimeout(cartPushTimer);
  cartPushTimer = setTimeout(async ()=>{
    const payload = {
      cart: saleCart, form: { customer:saleForm.customer, region:saleForm.region, phone:saleForm.phone },
      payments: { payNaqd:saleForm.payNaqd||0, payKarta:saleForm.payKarta||0, payNasiya:saleForm.payNasiya||0, paymentType:saleForm.paymentType||'' },
      deviceId: myDeviceId, updatedAt: Date.now()
    };
    lastCartSyncAt = payload.updatedAt;
    await sSet(activeCartKey(companyId), payload, true);
  }, 450);
}

async function clearActiveCart(companyId){
  if(!companyId) return;
  clearTimeout(cartPushTimer);
  lastCartSyncAt = Date.now();
  await sDel(activeCartKey(companyId), true);
}

async function pullActiveCartOnce(companyId){
  if(!companyId) return;
  try{
    const remote = await sGet(activeCartKey(companyId), true);
    if(!remote) return;
    if(remote.deviceId === myDeviceId) return; // o'zimiz yozgan - e'tiborsiz qoldiramiz
    if(remote.updatedAt && remote.updatedAt <= lastCartSyncAt) return; // eskirgan/allaqachon ko'rilgan
    lastCartSyncAt = remote.updatedAt || Date.now();
    saleCart = remote.cart || [];
    saleForm.customer = remote.form?.customer ?? saleForm.customer;
    saleForm.region = remote.form?.region ?? saleForm.region;
    saleForm.phone = remote.form?.phone ?? saleForm.phone;
    if(remote.payments){
      saleForm.payNaqd = remote.payments.payNaqd; saleForm.payKarta = remote.payments.payKarta; saleForm.payNasiya = remote.payments.payNasiya;
    }
    if(state.page==='sales'){
      toast('🔄 ' + t('cart_synced'));
      render();
    }
  }catch(e){ console.error('pullActiveCart error', e); }
}

function startCartSync(companyId){
  stopCartSync();
  pullActiveCartOnce(companyId);
  cartSyncInterval = setInterval(()=>{ pullActiveCartOnce(companyId); }, 3000);
}
function stopCartSync(){
  if(cartSyncInterval){ clearInterval(cartSyncInterval); cartSyncInterval = null; }
}

let whFilter = 'all';
let whSearch = '';
let psSearch = '';
let custSearch = '';
let custDebtOnly = false;
function productTotals(p){
  const storeQty = p.rollMode ? (p.rolls||[]).reduce((s,r)=>s+Number(r.length||0),0) : Number(p.stock||0);
  const whQty = p.rollMode ? (p.wRolls||[]).reduce((s,r)=>s+Number(r.length||0),0) : Number(p.wStock||0);
  const storeRolls = p.rollMode ? (p.rolls||[]).length : null;
  const whRolls = p.rollMode ? (p.wRolls||[]).length : null;
  return { storeQty, whQty, storeRolls, whRolls, total: storeQty+whQty };
}
function renderWarehouse(data){
  const search = whSearch.trim().toLowerCase();
  let products = data.products.filter(p=>{
    if(!search) return true;
    return (p.name||'').toLowerCase().includes(search) || (p.model||'').toLowerCase().includes(search) || (p.barcode||'').includes(search);
  });
  if(whFilter==='store') products = products.filter(p=>productTotals(p).storeQty>0);
  if(whFilter==='warehouse') products = products.filter(p=>productTotals(p).whQty>0);

  const totalQty = data.products.reduce((s,p)=>s+productTotals(p).total,0);
  const totalCostUZS = data.products.reduce((s,p)=>{
    const totals = productTotals(p);
    const costUZS = p.costCurrency==='usd' ? Number(p.cost||0)*FX_RATE : Number(p.cost||0);
    return s + costUZS*totals.total;
  },0);
  const totalSaleUZS = data.products.reduce((s,p)=>{
    const totals = productTotals(p);
    const priceUZS = p.priceCurrency==='usd' ? Number(p.price||0)*FX_RATE : Number(p.price||0);
    return s + priceUZS*totals.total;
  },0);

  return `
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
        <div style="display:flex; align-items:center; gap:12px;">
          <div style="width:44px;height:44px;border-radius:12px;background:rgba(62,155,255,0.14); display:flex; align-items:center; justify-content:center; font-size:20px;">📦</div>
          <div style="font-size:19px; font-weight:800;">${t('warehouse')}</div>
        </div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn-ghost btn-sm" id="openImportModal">📤 ${t('import_file')}</button>
        <button class="btn-ghost btn-sm" id="openTransferModal" style="border-color:rgba(122,79,224,0.4); color:#7A4FE0;">⇄ ${t('transfer_btn')}</button>
        <button class="btn-ghost btn-sm" id="openRestockModal" style="border-color:rgba(24,168,118,0.4); color:var(--success);">📷 ${t('restock_scan')}</button>
        <button class="btn-3d btn-sm" id="openProductModal">+ ${t('add_product')}</button>
      </div>
    </div>

    <div class="grid grid-3" style="margin-bottom:16px;">
      <div class="card stat-card stat-blue"><div class="stat-label">📦 ${t('jami')}</div><div class="stat-num">${money(totalQty)}</div><div style="font-size:11px; color:var(--muted); margin-top:2px;">${data.products.length} ${t('variety')}</div></div>
      <div class="card stat-card stat-gold"><div class="stat-label">💲 ${t('cost_value')}</div><div class="stat-num mono" style="font-size:17px;">${money(totalCostUZS)} UZS</div><div style="font-size:11px; color:var(--muted); margin-top:2px;">≈ $${(totalCostUZS/FX_RATE).toLocaleString('en-US',{maximumFractionDigits:0})}</div></div>
      <div class="card stat-card stat-green"><div class="stat-label">📈 ${t('sale_value')}</div><div class="stat-num mono" style="font-size:17px;">${money(totalSaleUZS)} UZS</div><div style="font-size:11px; color:var(--muted); margin-top:2px;">≈ $${(totalSaleUZS/FX_RATE).toLocaleString('en-US',{maximumFractionDigits:0})}</div></div>
    </div>

    <div class="tabbar" style="margin-bottom:14px;">
      <button data-whfilter="all" class="${whFilter==='all'?'active':''}">${t('filter_all')} (${data.products.length})</button>
      <button data-whfilter="store" class="${whFilter==='store'?'active':''}">🏬 ${t('filter_store')} (${data.products.filter(p=>productTotals(p).storeQty>0).length})</button>
      <button data-whfilter="warehouse" class="${whFilter==='warehouse'?'active':''}">🏭 ${t('filter_warehouse')} (${data.products.filter(p=>productTotals(p).whQty>0).length})</button>
    </div>
    <input id="whSearch" placeholder="🔎 ${t('search_products_ph')}" value="${whSearch}" style="margin-bottom:16px;">

    ${products.length ? products.map(p=>{
      const totals = productTotals(p);
      const locBadge = totals.storeQty>0 && totals.whQty>0 ? `<span class="badge badge-accent">${t('in_both')}</span>` : totals.storeQty>0 ? `<span class="badge badge-success">🏬 ${t('in_store')}</span>` : totals.whQty>0 ? `<span class="badge badge-muted">🏭 ${t('in_warehouse')}</span>` : `<span class="badge badge-muted">—</span>`;
      const isLow = totals.total <= Number(p.minStock||3);
      const priceLabel = p.priceCurrency==='usd' ? `$${p.price}` : money(p.price)+' UZS';
      return `
      <div class="card" style="margin-bottom:12px;">
        <div style="display:flex; gap:12px; align-items:flex-start;">
          <div style="width:52px; height:52px; border-radius:10px; background:var(--panel2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;">
            ${p.image ? `<img src="${p.image}" style="width:100%; height:100%; object-fit:cover;">` : '📦'}
          </div>
          <div style="flex:1; min-width:0;">
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
              <span style="font-weight:800; font-size:15px;">${p.name}</span>
              <span class="badge badge-accent">${p.unit}</span>
              ${isLow ? `<span class="badge" style="background:rgba(226,59,84,0.14); color:var(--danger);">⚠ ${t('low_stock')}</span>` : ''}
            </div>
            ${p.model ? `<div style="font-size:12px; color:var(--muted); margin-top:2px;">${p.model}</div>` : ''}
            ${p.barcode ? `<div style="font-size:11px; color:var(--muted); margin-top:2px;" class="mono">▤ ${p.barcode}</div>` : ''}
          </div>
          <div>${locBadge}</div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;">
          <div style="background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px 12px;">
            <div style="font-size:10.5px; color:var(--muted); text-transform:uppercase; font-weight:700; margin-bottom:4px;">🏭 ${t('warehouse')}</div>
            <div style="font-weight:800; font-size:15px;">${totals.whQty} ${p.unit}</div>
            ${p.rollMode ? `<div style="margin-top:6px; display:flex; gap:5px; flex-wrap:wrap;">${(p.wRolls||[]).map(r=>`<span class="badge badge-muted">${r.length}m</span>`).join('') || '—'}</div>` : ''}
          </div>
          <div style="background:rgba(24,168,118,0.08); border:1px solid rgba(24,168,118,0.3); border-radius:10px; padding:10px 12px;">
            <div style="font-size:10.5px; color:var(--success); text-transform:uppercase; font-weight:700; margin-bottom:4px;">🏬 ${t('filter_store')}</div>
            <div style="font-weight:800; font-size:15px; color:var(--success);">${totals.storeQty} ${p.unit}</div>
            ${p.rollMode ? `<div style="margin-top:6px; display:flex; gap:5px; flex-wrap:wrap;">${(p.rolls||[]).map(r=>`<span class="badge" style="background:rgba(24,168,118,0.15); color:var(--success);">${r.length}m</span>`).join('') || '—'}</div>` : ''}
          </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:12px; border-top:1px solid var(--border);">
          <div style="font-weight:800; color:var(--success);" class="mono">${priceLabel}</div>
          <div style="display:flex; gap:8px;">
            <button class="btn-ghost btn-sm" data-print-barcode="${p.id}">🏷 ${t('barcode')}</button>
            <button class="btn-ghost btn-sm" data-view-product="${p.id}">👁 ${t('details')}</button>
            <button class="btn-danger btn-sm" data-del-product="${p.id}">🗑</button>
          </div>
        </div>
      </div>
      `;
    }).join('') : `<div class="card empty-state"><div class="em-icon">📦</div>${t('empty_products')}</div>`}
  `;
}

    data.sales=[]; data.products=[]; data.partners=[]; data.partnerStores=[]; data.expenses=[]; data.purchases=[];
    const ok = await saveCompanyData(state.session.companyId, data);

    closeModal();

  };

  document.getElementById('m_reset_full').onclick = async ()=>{
    if(!confirm(t('reset_confirm_profile'))) return;

    const companyId = state.session.companyId;
    const username = state.session.username;
    const phone = state.session.phone;
    // Kompaniyaga tegishli barcha xodimlar loginlarini ham o'chiramiz
    for(const emp of (data.employees||[])){
      await sDel('user:'+emp.username, true);
    }
    await sDel('user:'+username, true);

  openModal(`

      <button class="btn-ghost" id="m_cancel" style="flex:1;">${t('cancel')}</button>
    </div>
  `);
  document.getElementById('m_cancel').onclick = closeModal;
  document.getElementById('m_save').onclick = async ()=>{
    const amount = Number(document.getElementById('m_amount').value)||0;

function addIncomingItem(data){
  if(incomingForm.quickMode){
    const costPriceUZS = toUZS(incomingForm.costPrice, incomingForm.costCurrency);
    if(!costPriceUZS) return toast(t('fill_all'));
    const note = (incomingForm.newProductName||'').trim();
    incomingCart.push({
      id:uid(), productId:null, productName: note || t('quick_item_label'), unit:'dona',
      qty:1, rolls:null, costPriceUZS, sellPriceUZS:0, totalCostUZS: costPriceUZS, debtOnly:true
    });
    incomingForm.costPrice=0; incomingForm.newProductName='';
    toast(t('saved'));
    render();
    return;
  }
  let productName, unit, existingProduct=null;
  if(incomingForm.mode==='catalog'){
    existingProduct = data.products.find(p=>p.id===incomingForm.catalogProductId);
    if(!existingProduct) return toast(t('pick_product_first'));
    productName = existingProduct.name;
    unit = existingProduct.unit;
  } else {
    productName = incomingForm.newProductName.trim() || t('quick_item_label');
    unit = incomingForm.unit;
  }
  const costPriceUZS = toUZS(incomingForm.costPrice, incomingForm.costCurrency);
  const sellPriceUZS = toUZS(incomingForm.sellPrice, incomingForm.sellCurrency);
  if(!costPriceUZS) return toast(t('fill_all'));

  let qty, rolls=null;
  if(unit==='metr'){
    if(!incomingForm.stagedRolls.length) return toast(t('fill_all'));
    rolls = incomingForm.stagedRolls.map(len=>({id:uid(), length:len}));
    qty = incomingForm.stagedRolls.reduce((s,v)=>s+v,0);
  } else {
    qty = Number(incomingForm.simpleQty)||0;
    if(qty<=0) return toast(t('fill_all'));
  }

  incomingCart.push({
    id:uid(), productId: existingProduct?existingProduct.id:null, productName, unit,
    qty, rolls, costPriceUZS, sellPriceUZS, totalCostUZS: costPriceUZS*qty
  });

  incomingForm.mode='catalog'; incomingForm.catalogProductId=''; incomingForm.newProductName='';
  incomingForm.costPrice=0; incomingForm.sellPrice=0; incomingForm.stagedRolls=[]; incomingForm.simpleQty=1;
  toast(t('saved'));
  render();
}

async function finalizeIncoming(data){
  if(!incomingForm.supplierId) return toast(t('pick_supplier_first'));
  if(!incomingCart.length) return toast(t('cart_empty'));
  const supplier = data.partners.find(p=>p.id===incomingForm.supplierId);
  if(!supplier) return toast(t('pick_supplier_first'));

  const cartTotal = incomingCart.reduce((s,i)=>s+i.totalCostUZS,0);
  let paidAmount;
  if(incomingForm.paymentType==='naqd' || incomingForm.paymentType==='karta') paidAmount = cartTotal;
  else if(incomingForm.paymentType==='qarz') paidAmount = 0;
  else paidAmount = Number(incomingForm.cashPaid)||0;
  const debtAmount = Math.max(0, cartTotal - paidAmount);

  const btn = document.getElementById('btnSaveIncoming');
  if(btn){ btn.disabled=true; btn.style.opacity='0.6'; }

  incomingCart.forEach(item=>{
    if(item.debtOnly) return; // faqat qarz uchun - ombor/mahsulotga ta'sir qilmaydi
    let prod = item.productId ? data.products.find(p=>p.id===item.productId) : null;
    if(!prod){
      prod = { id:uid(), name:item.productName, model:'', unit:item.unit, barcode:genBarcode(), minStock:3,
        cost:item.costPriceUZS, costCurrency:'uzs', price:item.sellPriceUZS||item.costPriceUZS, priceCurrency:'uzs',
        rollMode: item.unit==='metr', image:'', stock:0, rolls:[], wStock:0, wRolls:[] };
      data.products.push(prod);
    } else {
      prod.cost = item.costPriceUZS; prod.costCurrency='uzs';
      if(item.sellPriceUZS){ prod.price = item.sellPriceUZS; prod.priceCurrency='uzs'; }
    }
    const destKey = incomingForm.destination==='store' ? 'store' : 'warehouse';
    if(prod.rollMode){
      const newRolls = (item.rolls||[]).map(r=>({id:uid(), length:r.length}));
      if(destKey==='store'){ prod.rolls = (prod.rolls||[]).concat(newRolls); prod.stock = prod.rolls.reduce((s,r)=>s+r.length,0); }
      else { prod.wRolls = (prod.wRolls||[]).concat(newRolls); prod.wStock = prod.wRolls.reduce((s,r)=>s+r.length,0); }
    } else {
      if(destKey==='store') prod.stock = Number(prod.stock||0) + item.qty;
      else prod.wStock = Number(prod.wStock||0) + item.qty;
    }
  });

  supplier.debt = Number(supplier.debt||0) + debtAmount;

  data.purchases = data.purchases || [];
  data.purchases.push({
    id:uid(), supplierId: supplier.id, supplierName: supplier.name, destination: incomingForm.destination,
    items: incomingCart.map(i=>({productName:i.productName, unit:i.unit, qty:i.qty, costPriceUZS:i.costPriceUZS, totalCostUZS:i.totalCostUZS})),
    total: cartTotal, paymentType: incomingForm.paymentType, paidAmount, debtAmount, note: incomingForm.note,
    date:new Date().toISOString().slice(0,10)
  });

  const ok = await saveCompanyData(state.session.companyId, data);

    supplier.debt = Number(supplier.debt||0) - debtAmount; // bekor qilish

  }

}

/* Tovar oldik: ular bizga tovar berishdi -> biz qarzdor bo'lamiz, tovar bizning omborga/do'konga qo'shiladi */
async function modalStoreReceive(data, storeId){
  const store = (data.partnerStores||[]).find(s=>s.id===storeId);
  if(!store) return;
  openModal(`
    <h3 style="margin-bottom:6px;">📦 ${t('receive_goods')}</h3>
    <div style="font-size:12px; color:var(--muted); margin-bottom:14px;">${store.name}</div>
    <div class="field"><label>${t('search_catalog')}</label>
      <select id="rg_catalog">
        <option value="">${t('new_product_btn')}</option>
        ${data.products.map(p=>`<option value="${p.id}">${p.name}${p.model?' — '+p.model:''}</option>`).join('')}
      </select>
    </div>
    <div id="rg_newname_wrap" class="field"><label>${t('product_name')}</label><input id="rg_newname" placeholder="${t('new_product_name_ph')}"></div>
    <div class="field"><label>${t('unit')}</label>
      <select id="rg_unit">
        <option value="dona">Dona</option><option value="metr">Metr (Rulonlar)</option>
        <option value="qop">Qop</option><option value="kg">Kg</option><option value="litr">Litr</option>
      </select>
    </div>
    <div class="field"><label>${t('incoming_dest')}</label>
      <div class="tabbar" style="max-width:280px; margin-bottom:0;">
        <button type="button" data-rgdest="warehouse" class="rgdest-btn active">🏭 ${t('filter_warehouse')}</button>
        <button type="button" data-rgdest="store" class="rgdest-btn">🏬 ${t('filter_store')}</button>
      </div>
    </div>
    <div id="rg_rollswrap" style="display:none; background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:12px; margin-top:12px;">
      <div style="display:flex; gap:8px; margin-bottom:8px;">
        <input id="rg_rolllen" type="number" min="0" step="0.1" placeholder="${t('roll_meter_ph')}" style="flex:1;">
        <button type="button" class="btn-3d btn-sm" id="rg_addroll">+ ${t('add_btn')}</button>
      </div>
      <div id="rg_rollchips" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
    </div>
    <div id="rg_qtywrap" class="field" style="margin-top:12px;"><label>${t('simple_qty_label')}</label><input id="rg_qty" type="number" min="1" value="1"></div>
    <div class="field"><label>${t('sell_price')} (1 dona/metr)</label><input id="rg_price" type="number" min="0" placeholder="0"></div>
    <div style="background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px; display:flex; justify-content:space-between; margin-bottom:14px;">
      <span style="font-size:12.5px; font-weight:700;">${t('total_qty')}:</span>
      <span id="rg_total" class="mono" style="font-weight:800; color:var(--danger);">0</span>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn-3d" id="m_save" style="flex:1;">${t('save')}</button>
      <button class="btn-ghost" id="m_cancel" style="flex:1;">${t('cancel')}</button>
    </div>
  `);
  let rgRolls = [];
  let rgDest = 'warehouse';
  function recalcTotal(){
    const price = Number(document.getElementById('rg_price').value)||0;
    const isRoll = document.getElementById('rg_unit').value==='metr';
    const qty = isRoll ? rgRolls.reduce((s,v)=>s+v,0) : (Number(document.getElementById('rg_qty').value)||0);
    document.getElementById('rg_total').textContent = money(price*qty);
  }
  function renderChips(){
    document.getElementById('rg_rollchips').innerHTML = rgRolls.map((len,i)=>`<span class="badge badge-accent" style="display:flex; gap:6px; padding:5px 9px;">${len}m <span data-rgchip-del="${i}" style="cursor:pointer; color:var(--danger); font-weight:800;">✕</span></span>`).join('');
    document.querySelectorAll('[data-rgchip-del]').forEach(el=>{ el.onclick=()=>{ rgRolls.splice(Number(el.dataset.rgchipDel),1); renderChips(); recalcTotal(); }; });
    recalcTotal();
  }
  document.getElementById('rg_catalog').onchange = (e)=>{
    const prod = data.products.find(p=>p.id===e.target.value);
    document.getElementById('rg_newname_wrap').style.display = e.target.value ? 'none' : 'block';
    if(prod){ document.getElementById('rg_unit').value = prod.unit; document.getElementById('rg_unit').dispatchEvent(new Event('change')); document.getElementById('rg_price').value = prod.price||''; }
  };
  document.getElementById('rg_unit').onchange = (e)=>{
    const isRoll = e.target.value==='metr';
    document.getElementById('rg_rollswrap').style.display = isRoll?'block':'none';
    document.getElementById('rg_qtywrap').style.display = isRoll?'none':'block';
    recalcTotal();
  };
  document.getElementById('rg_addroll').onclick = ()=>{
    const v = Number(document.getElementById('rg_rolllen').value);
    if(!v||v<=0) return;
    rgRolls.push(v); document.getElementById('rg_rolllen').value=''; renderChips();
  };
  document.getElementById('rg_qty').oninput = recalcTotal;
  document.getElementById('rg_price').oninput = recalcTotal;
  document.querySelectorAll('.rgdest-btn').forEach(b=>{
    b.onclick = ()=>{ rgDest=b.dataset.rgdest; document.querySelectorAll('.rgdest-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); };
  });
  document.getElementById('m_cancel').onclick = closeModal;
  document.getElementById('m_save').onclick = async ()=>{
    const catalogId = document.getElementById('rg_catalog').value;
    const unit = document.getElementById('rg_unit').value;
    const isRoll = unit==='metr';
    const price = Number(document.getElementById('rg_price').value)||0;
    if(!price) return toast(t('fill_all'));
    let prod = catalogId ? data.products.find(p=>p.id===catalogId) : null;
    let productName = prod ? prod.name : document.getElementById('rg_newname').value.trim();
    if(!productName) return toast(t('fill_all'));
    let qty;
    if(isRoll){
      if(!rgRolls.length) return toast(t('fill_all'));
      qty = rgRolls.reduce((s,v)=>s+v,0);
    } else {
      qty = Number(document.getElementById('rg_qty').value)||0;
      if(qty<=0) return toast(t('fill_all'));
    }
    if(!prod){
      prod = { id:uid(), name:productName, model:'', unit, barcode:genBarcode(), minStock:3, cost:price, costCurrency:'uzs', price, priceCurrency:'uzs', rollMode:isRoll, image:'', stock:0, rolls:[], wStock:0, wRolls:[] };
      data.products.push(prod);
    }
    if(isRoll){
      const newRolls = rgRolls.map(len=>({id:uid(), length:len}));
      if(rgDest==='store'){ prod.rolls=(prod.rolls||[]).concat(newRolls); prod.stock=prod.rolls.reduce((s,r)=>s+r.length,0); }
      else { prod.wRolls=(prod.wRolls||[]).concat(newRolls); prod.wStock=prod.wRolls.reduce((s,r)=>s+r.length,0); }
    } else {
      if(rgDest==='store') prod.stock = Number(prod.stock||0)+qty;
      else prod.wStock = Number(prod.wStock||0)+qty;
    }
    const value = price*qty;
    store.weOweThem = Number(store.weOweThem||0) + value;
    storeLogTx(store, `📦 ${productName} (${qty} ${unit})`, value, false);
    const ok = await saveCompanyData(state.session.companyId, data);
    if(!ok) return;
    closeModal(); toast(t('saved')); render();
  };
}

/* Tovar berdik: biz ularga tovar berdik -> ular bizga qarzdor bo'ladi, tovar bizning ombor/do'kondan ayiriladi */
async function modalStoreGive(data, storeId){
  const store = (data.partnerStores||[]).find(s=>s.id===storeId);
  if(!store) return;
  if(!data.products.length) return toast(t('empty_products'));
  openModal(`
    <h3 style="margin-bottom:6px;">📤 ${t('give_goods')}</h3>
    <div style="font-size:12px; color:var(--muted); margin-bottom:14px;">${store.name}</div>
    <div class="field"><label>${t('product')}</label>
      <select id="gg_product">${data.products.map(p=>{
        const totals = productTotals(p);
        return `<option value="${p.id}">${p.name} (🏬${totals.storeQty} · 🏭${totals.whQty})</option>`;
      }).join('')}</select>
    </div>
    <div class="field"><label>${t('transfer_from')}</label>
      <div class="tabbar" style="max-width:280px; margin-bottom:0;">
        <button type="button" data-ggsrc="store" class="ggsrc-btn active">🏬 ${t('filter_store')}</button>
        <button type="button" data-ggsrc="warehouse" class="ggsrc-btn">🏭 ${t('filter_warehouse')}</button>
      </div>
    </div>
    <div id="gg_body" style="margin-top:12px;"></div>
    <div class="field"><label>${t('sell_price')} (1 dona/metr)</label><input id="gg_price" type="number" min="0"></div>
    <div style="background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px; display:flex; justify-content:space-between; margin-bottom:14px;">
      <span style="font-size:12.5px; font-weight:700;">${t('total_qty')}:</span>
      <span id="gg_total" class="mono" style="font-weight:800; color:var(--success);">0</span>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn-3d" id="m_save" style="flex:1;">${t('save')}</button>
      <button class="btn-ghost" id="m_cancel" style="flex:1;">${t('cancel')}</button>
    </div>
  `);
  let ggSrc = 'store';
  function recalc(){
    const price = Number(document.getElementById('gg_price').value)||0;
    const prod = data.products.find(p=>p.id===document.getElementById('gg_product').value);
    let qty = 0;
    if(prod && prod.rollMode){
      const rollSel = document.getElementById('gg_roll');
      qty = rollSel ? Number(rollSel.selectedOptions[0]?.dataset.len||0) : 0;
    } else {
      const qtyInput = document.getElementById('gg_qty');
      qty = qtyInput ? Number(qtyInput.value)||0 : 0;
    }
    document.getElementById('gg_total').textContent = money(price*qty);
  }
  function renderBody(){
    const prod = data.products.find(p=>p.id===document.getElementById('gg_product').value);
    const body = document.getElementById('gg_body');
    if(!prod){ body.innerHTML=''; return; }
    document.getElementById('gg_price').value = prod.price || '';
    if(prod.rollMode){
      const rolls = ggSrc==='store' ? (prod.rolls||[]) : (prod.wRolls||[]);
      body.innerHTML = `<div class="field"><label>${t('select_roll')}</label>
        <select id="gg_roll">${rolls.length ? rolls.map(r=>`<option value="${r.id}" data-len="${r.length}">${r.length}m</option>`).join('') : `<option value="">—</option>`}</select></div>`;
      const sel = document.getElementById('gg_roll');
      if(sel) sel.onchange = recalc;
    } else {
      const avail = ggSrc==='store' ? Number(prod.stock||0) : Number(prod.wStock||0);
      body.innerHTML = `<div class="field"><label>${t('qty')} (${t('stock')}: ${avail})</label><input id="gg_qty" type="number" min="1" max="${avail}" value="1"></div>`;
      document.getElementById('gg_qty').oninput = recalc;
    }
    recalc();
  }
  document.getElementById('gg_product').onchange = renderBody;
  document.querySelectorAll('.ggsrc-btn').forEach(b=>{
    b.onclick = ()=>{ ggSrc=b.dataset.ggsrc; document.querySelectorAll('.ggsrc-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderBody(); };
  });
  document.getElementById('gg_price').oninput = recalc;
  renderBody();
  document.getElementById('m_cancel').onclick = closeModal;
  document.getElementById('m_save').onclick = async ()=>{
    const prod = data.products.find(p=>p.id===document.getElementById('gg_product').value);
    if(!prod) return;
    const price = Number(document.getElementById('gg_price').value)||0;
    if(!price) return toast(t('fill_all'));
    let qty, rollId=null;
    if(prod.rollMode){
      const sel = document.getElementById('gg_roll');
      rollId = sel ? sel.value : '';
      if(!rollId) return toast(t('fill_all'));
      qty = Number(sel.selectedOptions[0].dataset.len);
      if(ggSrc==='store'){ prod.rolls = (prod.rolls||[]).filter(r=>r.id!==rollId); prod.stock=(prod.rolls||[]).reduce((s,r)=>s+r.length,0); }
      else { prod.wRolls = (prod.wRolls||[]).filter(r=>r.id!==rollId); prod.wStock=(prod.wRolls||[]).reduce((s,r)=>s+r.length,0); }
    } else {
      qty = Number(document.getElementById('gg_qty').value)||0;
      const avail = ggSrc==='store' ? Number(prod.stock||0) : Number(prod.wStock||0);
      if(qty<=0 || qty>avail) return toast(t('exceeds_stock'));
      if(ggSrc==='store') prod.stock -= qty; else prod.wStock -= qty;
    }
    const value = price*qty;
    store.theyOweUs = Number(store.theyOweUs||0) + value;
    storeLogTx(store, `📤 ${prod.name} (${qty} ${prod.unit})`, value, true);
    const ok = await saveCompanyData(state.session.companyId, data);
    if(!ok) return;
    closeModal(); toast(t('saved')); render();
  };
}

/* ---- MIJOZLAR (CUSTOMERS) ---- */
function customerDebtMap(data){
  const map = {};
  data.sales.filter(s=>Number(s.nasiyaAmount||0)>0 && !s.paid).forEach(s=>{
    const key = s.customer || '—';
    const remain = Number(s.nasiyaAmount||0) - Number(s.nasiyaPaidAmount||0);
    map[key] = (map[key]||0) + Math.max(0, remain);
  });
  return map;
}
/* Mijoz qarzini eskilaridan boshlab yopadi (qisman to'lov qo'llab-quvvatlanadi) */
async function payCustomerDebt(data, customerName, amount){
  let remaining = amount;
  const sales = data.sales
    .filter(s=>(s.customer||'—')===customerName && Number(s.nasiyaAmount||0)>0 && !s.paid)
    .sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  for(const s of sales){
    if(remaining<=0) break;
    const owed = Number(s.nasiyaAmount||0) - Number(s.nasiyaPaidAmount||0);
    if(owed<=0) continue;
    const pay = Math.min(owed, remaining);
    s.nasiyaPaidAmount = Number(s.nasiyaPaidAmount||0) + pay;
    remaining -= pay;
    if(s.nasiyaPaidAmount >= Number(s.nasiyaAmount||0) - 0.01) s.paid = true;
  }
  return await saveCompanyData(state.session.companyId, data);
}

/* ---- SALES CART LOGIC ---- */
function addToCart(data){
  const product = data.products.find(p=>p.id===saleForm.selProductId);
  if(!product) return toast(t('pick_product_first'));
  const box = Number(saleForm.box)||1;
  let price = Number(saleForm.price)||0;
  if(saleForm.priceCurrency==='usd') price = Math.round(price*FX_RATE);
  let qty, rollId=null, mode='simple';

  if(product.rollMode){
    const roll = (product.rolls||[]).find(r=>r.id===saleForm.selRollId);
    if(!roll) return toast(t('pick_product_first'));
    if(saleForm.sellMode==='roll'){
      qty = roll.length; mode='roll-whole'; rollId = roll.id;
    } else {
      qty = (Number(saleForm.qty)||0) * box;
      if(qty<=0 || qty>roll.length) return toast(t('exceeds_stock'));
      mode='roll-meter'; rollId = roll.id;
    }
  } else {
    qty = (Number(saleForm.qty)||0) * box;
    if(qty<=0 || qty>Number(product.stock)) return toast(t('exceeds_stock'));
  }
  if(!price) return toast(t('fill_all'));

  saleCart.push({ id:uid(), productId:product.id, productName:product.name, mode, rollId, qty, unit:product.unit, price, total:price*qty });
  saleForm.qty = 1; saleForm.box = 1; saleForm.price = 0;
  pushActiveCart(state.session.companyId);
  toast(t('saved'));
  render();
}

let saleSaving = false;
async function finalizeSale(data){
  if(saleSaving) return; // ikki marta bosishning oldini olish
  if(!saleCart.length) return toast(t('cart_empty'));
  const total = saleCart.reduce((s,i)=>s+i.total,0);
  let naqdAmount = Number(saleForm.payNaqd)||0;
  let kartaAmount = Number(saleForm.payKarta)||0;
  let nasiyaAmount = Number(saleForm.payNasiya)||0;
  if(naqdAmount+kartaAmount+nasiyaAmount<=0 && total>0){
    naqdAmount = total; // hech qanday to'lov turi kiritilmasa, sukut bo'yicha naqd deb belgilanadi
  }

  const btn = document.getElementById('btnSaveSale');
  if(btn){ btn.disabled = true; btn.style.opacity='0.6'; }
  saleSaving = true;

  // ombordan (do'kon) miqdorlarni tekshirish - yetarli zaxira bormi
  for(const item of saleCart){
    const prod = data.products.find(p=>p.id===item.productId);
    if(!prod){ saleSaving=false; if(btn){btn.disabled=false; btn.style.opacity='1';} return toast(t('barcode_not_found')); }
    if(prod.rollMode){
      if(item.mode==='roll-meter'){
        const roll = (prod.rolls||[]).find(r=>r.id===item.rollId);
        if(!roll || roll.length < item.qty){ saleSaving=false; if(btn){btn.disabled=false; btn.style.opacity='1';} return toast(t('exceeds_stock')); }
      } else {
        const roll = (prod.rolls||[]).find(r=>r.id===item.rollId);
        if(!roll){ saleSaving=false; if(btn){btn.disabled=false; btn.style.opacity='1';} return toast(t('exceeds_stock')); }
      }
    } else {
      if(Number(prod.stock) < item.qty){ saleSaving=false; if(btn){btn.disabled=false; btn.style.opacity='1';} return toast(t('exceeds_stock')); }
    }
  }

  // decrement stock / rolls (do'kon zaxirasidan)
  saleCart.forEach(item=>{
    const prod = data.products.find(p=>p.id===item.productId);
    if(!prod) return;
    if(prod.rollMode){
      if(item.mode==='roll-whole'){
        prod.rolls = (prod.rolls||[]).filter(r=>r.id!==item.rollId);
      } else {
        const roll = (prod.rolls||[]).find(r=>r.id===item.rollId);
        if(roll){ roll.length -= item.qty; if(roll.length<=0) prod.rolls = prod.rolls.filter(r=>r.id!==roll.id); }
      }
      prod.stock = (prod.rolls||[]).reduce((s,r)=>s+r.length,0);
    } else {
      prod.stock = Number(prod.stock) - item.qty;
    }
  });

  const invoiceNo = nextInvoiceNo(data);
  const newSale = {
    id:uid(), invoiceNo, customer: saleForm.customer.trim(), region: saleForm.region, phone: saleForm.phone.trim(),
    items: saleCart.map(i=>({productId:i.productId, productName:i.productName, qty:i.qty, unit:i.unit, price:i.price, total:i.total})),
    total, naqdAmount, kartaAmount, nasiyaAmount, nasiyaPaidAmount:0, paid: nasiyaAmount<=0,
    date:new Date().toISOString().slice(0,10)
  };
  data.sales.push(newSale);
  // Mijoz ismi va telefon kiritilgan bo'lsa, avtomatik Mijozlar ro'yxatiga qo'shamiz (agar hali yo'q bo'lsa)
  if(newSale.customer){
    const exists = data.partners.find(p=>p.type==='customers' && p.name.toLowerCase()===newSale.customer.toLowerCase());
    if(!exists){
      data.partners.push({ id:uid(), type:'customers', name:newSale.customer, phone:newSale.phone||'', region:newSale.region||'', debt:0 });
    } else if(newSale.phone && !exists.phone){
      exists.phone = newSale.phone;
    }
  }
  const ok = await saveCompanyData(state.session.companyId, data);
  saleSaving = false;
  if(btn){ btn.disabled = false; btn.style.opacity='1'; }
  if(!ok){
    // saqlash muvaffaqiyatsiz bo'lsa - o'zgarishni bekor qilamiz, savat va forma saqlanib qoladi
    data.sales.pop();
    saleCart.forEach(item=>{
      const prod = data.products.find(p=>p.id===item.productId);
      if(!prod) return;
      if(prod.rollMode){
        if(item.mode==='roll-whole'){ prod.rolls = prod.rolls||[]; prod.rolls.push({id:item.rollId||uid(), length:item.qty}); }
        else { const roll=(prod.rolls||[]).find(r=>r.id===item.rollId); if(roll) roll.length += item.qty; else { prod.rolls=prod.rolls||[]; prod.rolls.push({id:item.rollId||uid(), length:item.qty}); } }
        prod.stock = (prod.rolls||[]).reduce((s,r)=>s+r.length,0);
      } else { prod.stock = Number(prod.stock) + item.qty; }
    });
    return; // saleCart/saleForm tozalanmaydi, foydalanuvchi qayta urinishi mumkin
  }
  const wantsTelegram = document.getElementById('sf_telegram') ? document.getElementById('sf_telegram').checked : true;
  const autoReceipt = data.settings ? data.settings.autoReceipt!==false : true;

async function returnSale(data, saleId){
  if(!confirm(t('confirm_return'))) return;
  const sale = data.sales.find(s=>s.id===saleId);
  if(!sale) return;
  (sale.items||[]).forEach(item=>{
    const prod = data.products.find(p=>p.id===item.productId);
    if(!prod) return;
    if(prod.rollMode){
      prod.rolls = prod.rolls || [];
      prod.rolls.push({ id:uid(), length:item.qty });
      prod.stock = prod.rolls.reduce((s,r)=>s+r.length,0);
    } else {
      prod.stock = Number(prod.stock) + item.qty;
    }
  });
  data.sales = data.sales.filter(s=>s.id!==saleId);
  await saveCompanyData(state.session.companyId, data);
  toast(t('deleted'));
  render();
}

function buildReceiptHTML(companyName, cfg, sale, logo){
  const widthMap = { '58mm':'260px', '80mm':'320px' };
  const maxW = widthMap[cfg.size] || '320px';
  const dash = `<div style="border-top:2px dashed #000; margin:10px 0;"></div>`;
  const logoHtml = (cfg.showLogo!==false && logo) ? `<img src="${logo}" style="width:44px; height:44px; border-radius:10px; object-fit:cover; margin:0 auto 8px; display:block;">` : '';
  const addressHtml = (cfg.address) ? `<div style="text-align:center; font-size:11.5px; color:#333;">${cfg.address}</div>` : '';
  const phonesHtml = (cfg.showPhone!==false && cfg.phones && cfg.phones.length) ? `<div style="text-align:center; font-size:11.5px; color:#333;">Tel: ${cfg.phones.join(', ')}</div>` : '';
  const tgHtml = (cfg.showTelegram && cfg.telegramChannel) ? `

    <div style="text-align:center; font-size:10px; color:#333; word-break:break-all;">${cfg.telegramChannel}</div>
  ` : '';

  return `
    <div style="max-width:${maxW}; margin:0 auto; font-family:'IBM Plex Mono',monospace; background:#fff; color:#000; padding:18px 16px; border-radius:6px;">
      ${logoHtml}
      <div style="text-align:center; font-weight:800; font-size:16px; letter-spacing:.5px;">${(companyName||'').toUpperCase()}</div>
      ${addressHtml}
      ${phonesHtml}
      ${dash}
      <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:700;"><span>${t('receipt_no')}:</span><span>#${sale.invoiceNo||''}</span></div>
      <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:700; margin-top:3px;"><span>${t('date')}:</span><span>${sale.date||''}</span></div>
      <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:700; margin-top:3px;"><span>${t('cashier')}:</span><span>${sale.cashier||''}</span></div>
      ${dash}
      <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:800; border-bottom:1.5px solid #000; padding-bottom:4px;">
        <span style="flex:2;">${t('item_col')}</span><span style="flex:1; text-align:center;">${t('qty_col')}</span><span style="flex:1; text-align:right;">${t('sum_col')}</span>
      </div>
      ${(sale.items||[]).map(i=>`
        <div style="display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; padding:7px 0; border-bottom:1px solid #ddd;">
          <span style="flex:2;">${i.productName}</span><span style="flex:1; text-align:center;">${i.qty}${i.unit?' '+i.unit:''}</span><span style="flex:1; text-align:right;">${money(i.total)}</span>
        </div>`).join('')}
      ${dash}
      <div style="display:flex; justify-content:space-between; font-weight:800; font-size:16px;">
        <span>${t('grand_total_label')}:</span><span>${money(sale.total)} UZS</span>
      </div>
      ${dash}
      <div style="text-align:center; font-weight:700; font-size:12.5px;">${cfg.thanksText || t('thanks')}</div>
      ${tgHtml}
    </div>
  `;
}

  let selectedLoc = 'store';

      document.querySelectorAll('.loc-btn').forEach(x=>x.classList.remove('active'));

    };
  });

  document.getElementById('m_image_file').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const preview = document.getElementById('imgPreview');
    if(preview) preview.innerHTML = '⏳';
    const compressed = await compressImage(file);
    const previewAfter = document.getElementById('imgPreview');
    if(!previewAfter) return; // modal yopilgan bo'lishi mumkin
    if(!compressed){ toast(t('import_failed')); previewAfter.innerHTML = '🖼'; return; }
    uploadedImage = compressed;
    previewAfter.innerHTML = `<img src="${uploadedImage}" style="width:100%; height:100%; object-fit:cover;">`;
  };

  document.getElementById('m_unit').onchange = (e)=>{
    const isRoll = e.target.value==='metr';
    document.getElementById('rollsWrap').style.display = isRoll ? 'block' : 'none';
    document.getElementById('simpleStockWrap').style.display = isRoll ? 'none' : 'block';
  };

  function renderChips(){
    const wrap = document.getElementById('rollChips');
    wrap.innerHTML = chipRolls.map((len,i)=>`<span class="badge badge-accent" style="display:flex; align-items:center; gap:6px; padding:6px 10px;">${i+1}: ${len}m <span data-chip-del="${i}" style="cursor:pointer; color:var(--danger); font-weight:800;">✕</span></span>`).join('');
    wrap.querySelectorAll('[data-chip-del]').forEach(el=>{
      el.onclick = ()=>{ chipRolls.splice(Number(el.dataset.chipDel),1); renderChips(); };
    });
    const total = chipRolls.reduce((s,v)=>s+v,0);
    document.getElementById('rollTotalLabel').textContent = `${total} m (${chipRolls.length} ${t('rolls_count_short')})`;
    document.getElementById('rollCountLabel').textContent = `${chipRolls.length} ${t('rolls_count_short')}`;
  }
  document.getElementById('addRollChip').onclick = ()=>{
    const v = Number(document.getElementById('rollLenInput').value);
    if(!v || v<=0) return;
    chipRolls.push(v);
    document.getElementById('rollLenInput').value = '';
    renderChips();
  };

  document.getElementById('m_autobtn').onclick = ()=>{ document.getElementById('m_barcode').value = genBarcode(); };
  document.getElementById('m_scanbtn').onclick = ()=>{
    openBarcodeScanner((code)=>{ document.getElementById('m_barcode').value = code; toast(t('saved')); });
  };
  document.getElementById('m_cancel').onclick = closeModal;
  document.getElementById('m_save').onclick = async ()=>{
    const name = document.getElementById('m_name').value.trim();
    const model = document.getElementById('m_model').value.trim();
    const unit = document.getElementById('m_unit').value;
    const rollMode = unit==='metr';
    const minStock = Number(document.getElementById('m_minstock').value)||3;
    const cost = Number(document.getElementById('m_cost').value)||0;
    const costCurrency = document.getElementById('m_cost_cur').value;
    const price = Number(document.getElementById('m_price').value)||0;
    const priceCurrency = document.getElementById('m_price_cur').value;
    let barcode = document.getElementById('m_barcode').value.trim();
    if(!barcode) barcode = genBarcode();
    if(!name || !price) return toast(t('fill_all'));

    const product = {
      id:uid(), name, model, unit, barcode, minStock, cost, costCurrency, price, priceCurrency, rollMode, image: uploadedImage,
      stock:0, rolls:[], wStock:0, wRolls:[]
    };

    if(rollMode){
      if(!chipRolls.length) return toast(t('fill_all'));
      const rollsArr = chipRolls.map(len=>({ id:uid(), length:len }));
      if(selectedLoc==='store'){ product.rolls = rollsArr; product.stock = chipRolls.reduce((s,v)=>s+v,0); }
      else { product.wRolls = rollsArr; product.wStock = chipRolls.reduce((s,v)=>s+v,0); }
    } else {
      const stock = Number(document.getElementById('m_stock').value)||0;
      if(selectedLoc==='store') product.stock = stock; else product.wStock = stock;
    }
    data.products.push(product);
    const ok = await saveCompanyData(state.session.companyId, data);
    if(!ok) return;
    closeModal(); toast(t('saved')); render();
  };
}
