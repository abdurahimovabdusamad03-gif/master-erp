function openImportModal(data){
  openModal(`
    <h3 style="margin-bottom:10px;">📤 ${t('import_products_title')}</h3>
    <div style="font-size:12px; color:var(--muted); margin-bottom:12px;">${t('csv_columns_hint')}</div>
    <button type="button" class="btn-ghost btn-sm" id="btnDownloadTemplate" style="margin-bottom:14px;">⬇ ${t('download_template')}</button>
    <div class="field">
      <input type="file" id="csvFile" accept=".csv,text/csv">
    </div>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn-3d" id="m_import" style="flex:1;">📤 ${t('import_file')}</button>
      <button class="btn-ghost" id="m_cancel" style="flex:1;">${t('cancel')}</button>
    </div>
  `);
  document.getElementById('btnDownloadTemplate').onclick = ()=>{
    const csvContent = "nomi,modeli,birlik,soni,tannarx,narx\nGilam Silk,Classic 3x4,dona,10,450000,650000\nMato Rulon,Premium,metr,50,25000,38000\n";
    const blob = new Blob([csvContent], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'tovarlar_namuna.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  document.getElementById('m_cancel').onclick = closeModal;
  document.getElementById('m_import').onclick = ()=>{
    const file = document.getElementById('csvFile').files[0];
    if(!file) return toast(t('fill_all'));
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const text = reader.result;
        const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
        let count = 0;
        lines.forEach(line=>{
          const cols = line.split(',').map(c=>c.trim());
          if(cols[0] && cols[0].toLowerCase()==='nomi') return; // header row skip
          const [name, model, unit, stock, cost, price] = cols;
          if(!name || isNaN(Number(price))) return;
          data.products.push({
            id:uid(), name, model:model||'', unit: unit||'dona', barcode: genBarcode(), minStock:3,
            cost:Number(cost)||0, costCurrency:'uzs', price:Number(price)||0, priceCurrency:'uzs',
            rollMode:false, image:'', stock:Number(stock)||0, rolls:[], wStock:0, wRolls:[]
          });
          count++;
        });
        await saveCompanyData(state.session.companyId, data);
        closeModal();
        toast(t('import_success').replace('{n}', count));
        render();
      }catch(e){ toast(t('import_failed')); }
    };
    reader.readAsText(file);
  };
}

function openTransferModal(data){
  if(!data.products.length) return toast(t('empty_products'));
  openModal(`
    <h3 style="margin-bottom:16px;">⇄ ${t('transfer_title')}</h3>
    <div class="field"><label>${t('transfer_product')}</label>
      <select id="tr_product">${data.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
    </div>
    <div class="tabbar" style="max-width:320px; margin-bottom:14px;">
      <button type="button" data-dir="w2s" class="active">${t('filter_warehouse')} → ${t('filter_store')}</button>
      <button type="button" data-dir="s2w">${t('filter_store')} → ${t('filter_warehouse')}</button>
    </div>
    <div id="trBody"></div>
    <div style="display:flex; gap:10px; margin-top:14px;">
      <button class="btn-3d" id="m_transfer" style="flex:1;">⇄ ${t('transfer_btn')}</button>
      <button class="btn-ghost" id="m_cancel" style="flex:1;">${t('cancel')}</button>
    </div>
  `);
  let dir = 'w2s';
  function renderBody(){
    const prod = data.products.find(p=>p.id===document.getElementById('tr_product').value);
    const body = document.getElementById('trBody');
    if(!prod){ body.innerHTML=''; return; }
    const fromKey = dir==='w2s' ? 'warehouse' : 'store';
    if(prod.rollMode){
      const rolls = dir==='w2s' ? (prod.wRolls||[]) : (prod.rolls||[]);
      body.innerHTML = `
        <div class="field"><label>${t('transfer_roll_pick')} (${t('multi_select_hint')})</label>
          <div style="display:flex; flex-direction:column; gap:6px; max-height:220px; overflow:auto; border:1px solid var(--border); border-radius:10px; padding:10px;">
            ${rolls.length ? rolls.map(r=>`
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer; text-transform:none; font-weight:600; font-size:13px;">
                <input type="checkbox" class="trRollCb" value="${r.id}" style="width:auto; accent-color:var(--accent);"> ${r.length} m
              </label>
            `).join('') : `<span style="color:var(--muted); font-size:13px;">—</span>`}
          </div>
        </div>`;
    } else {
      const avail = dir==='w2s' ? Number(prod.wStock||0) : Number(prod.stock||0);
      body.innerHTML = `
        <div class="field"><label>${t('transfer_qty')} (${t('stock')}: ${avail})</label>
          <input id="tr_qty" type="number" min="0" max="${avail}" value="0"></div>`;
    }
  }
  document.getElementById('tr_product').onchange = renderBody;
  document.querySelectorAll('[data-dir]').forEach(b=>{
    b.onclick = ()=>{
      dir = b.dataset.dir;
      document.querySelectorAll('[data-dir]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      renderBody();
    };
  });
  renderBody();
  document.getElementById('m_cancel').onclick = closeModal;
  document.getElementById('m_transfer').onclick = async ()=>{
    const prod = data.products.find(p=>p.id===document.getElementById('tr_product').value);
    if(!prod) return;
    if(prod.rollMode){
      const rollIds = Array.from(document.querySelectorAll('.trRollCb:checked')).map(cb=>cb.value);
      if(!rollIds.length) return toast(t('fill_all'));
      const fromArr = dir==='w2s' ? (prod.wRolls||[]) : (prod.rolls||[]);
      const movedRolls = fromArr.filter(r=>rollIds.includes(r.id));
      if(!movedRolls.length) return toast(t('fill_all'));
      if(dir==='w2s'){
        prod.wRolls = (prod.wRolls||[]).filter(r=>!rollIds.includes(r.id));
        prod.rolls = (prod.rolls||[]).concat(movedRolls);
      } else {
        prod.rolls = (prod.rolls||[]).filter(r=>!rollIds.includes(r.id));
        prod.wRolls = (prod.wRolls||[]).concat(movedRolls);
      }
      prod.stock = (prod.rolls||[]).reduce((s,r)=>s+r.length,0);
      prod.wStock = (prod.wRolls||[]).reduce((s,r)=>s+r.length,0);
    } else {
      const qty = Number(document.getElementById('tr_qty').value)||0;
      const avail = dir==='w2s' ? Number(prod.wStock||0) : Number(prod.stock||0);
      if(qty<=0 || qty>avail) return toast(t('exceeds_stock'));
      if(dir==='w2s'){ prod.wStock -= qty; prod.stock = Number(prod.stock||0)+qty; }
      else { prod.stock -= qty; prod.wStock = Number(prod.wStock||0)+qty; }
    }
    await saveCompanyData(state.session.companyId, data);
    closeModal(); toast(t('transfer_done')); render();
  };
}

  const btnQuickScan = document.getElementById('btnQuickScan');
  if(btnQuickScan) btnQuickScan.onclick = ()=>openQuickScan(data);
  document.getElementById('logoutBtn').onclick = logout;
  const settingsLogoutBtn = document.getElementById('settingsLogoutBtn');
  if(settingsLogoutBtn) settingsLogoutBtn.onclick = logout;
  document.querySelectorAll('.lang-mini').forEach(b=>{
    b.onclick = ()=>{ state.lang = b.dataset.lang; savePrefs(); render(); };
  });
  document.querySelectorAll('[data-theme]').forEach(b=>{
    if(!b.classList.contains('swatch')) return;
    b.onclick = ()=>{ state.theme = b.dataset.theme; savePrefs(); render(); };
  });
  document.querySelectorAll('[data-ptab]').forEach(b=>{
    b.onclick = ()=>{ state.partnerTab = b.dataset.ptab; render(); };
  });
  document.querySelectorAll('[data-currency]').forEach(b=>{
    b.onclick = ()=>{ state.currency = b.dataset.currency; render(); };
  });
  const dFrom = document.getElementById('dateFrom');
  const dTo = document.getElementById('dateTo');
  if(dFrom) dFrom.onchange = ()=>{ state.dateFrom = dFrom.value; render(); };
  if(dTo) dTo.onchange = ()=>{ state.dateTo = dTo.value; render(); };
  const btnToday = document.getElementById('btnToday');
  if(btnToday) btnToday.onclick = ()=>{ state.dateFrom = todayStr(); state.dateTo = todayStr(); render(); };
  const btnSaveFxRate = document.getElementById('btnSaveFxRate');
  if(btnSaveFxRate) btnSaveFxRate.onclick = async ()=>{
    const v = Number(document.getElementById('fxRateInput').value)||FX_RATE;
    data.settings = data.settings || {};
    data.settings.fxRate = v;
    FX_RATE = v;
    const ok = await saveCompanyData(state.session.companyId, data);
    if(!ok) return;
    toast(t('saved')); render();
  };

  {
    const openProduct = document.getElementById('openProductModal');
    if(openProduct) openProduct.onclick = ()=>modalAddProduct(data);
    const openImport = document.getElementById('openImportModal');
    if(openImport) openImport.onclick = ()=>openImportModal(data);
    const openTransfer = document.getElementById('openTransferModal');
    if(openTransfer) openTransfer.onclick = ()=>openTransferModal(data);
    const openRestock = document.getElementById('openRestockModal');
    if(openRestock) openRestock.onclick = ()=>openRestockModal(data);
    const whSearchEl = document.getElementById('whSearch');
    if(whSearchEl) whSearchEl.oninput = ()=>{ whSearch = whSearchEl.value; render(); };
    document.querySelectorAll('[data-whfilter]').forEach(b=>{
      b.onclick = ()=>{ whFilter = b.dataset.whfilter; render(); };
    });
    const openPartner = document.getElementById('openPartnerModal'); // hozircha ishlatilmaydi (Kirim orqali qo'shiladi)
    if(openPartner) openPartner.onclick = ()=>modalAddPartner(data);

    /* ---- Partner stores (Sherik Do'konlar) bindings ---- */
    const btnAddStore = document.getElementById('btnAddStore');
    if(btnAddStore) btnAddStore.onclick = ()=>modalAddStore(data);
    const psSearchEl = document.getElementById('psSearch');
    if(psSearchEl) psSearchEl.oninput = ()=>{ psSearch = psSearchEl.value; render(); };
    document.querySelectorAll('[data-del-store]').forEach(b=>{
      b.onclick = async ()=>{
        data.partnerStores = (data.partnerStores||[]).filter(s=>s.id!==b.dataset.delStore);
        await saveCompanyData(state.session.companyId,data); toast(t('deleted')); render();
      };
    });
    document.querySelectorAll('[data-store-receive]').forEach(b=>{
      b.onclick = ()=>modalStoreReceive(data, b.dataset.storeReceive);
    });
    document.querySelectorAll('[data-store-give]').forEach(b=>{
      b.onclick = ()=>modalStoreGive(data, b.dataset.storeGive);
    });
    document.querySelectorAll('[data-store-pay]').forEach(b=>{
      b.onclick = ()=>modalStorePay(data, b.dataset.storePay);
    });

    /* ---- Customers (Mijozlar) bindings ---- */
    const btnAddCustomer = document.getElementById('btnAddCustomer');
    if(btnAddCustomer) btnAddCustomer.onclick = ()=>modalAddCustomer(data);
    const btnDebtorsOnly = document.getElementById('btnDebtorsOnly');
    if(btnDebtorsOnly) btnDebtorsOnly.onclick = ()=>{ custDebtOnly = !custDebtOnly; render(); };
    const custSearchEl = document.getElementById('custSearch');
    if(custSearchEl) custSearchEl.oninput = ()=>{ custSearch = custSearchEl.value; render(); };
    document.querySelectorAll('[data-del-customer]').forEach(b=>{
      b.onclick = async ()=>{
        data.partners = data.partners.filter(p=>p.id!==b.dataset.delCustomer);
        await saveCompanyData(state.session.companyId,data); toast(t('deleted')); render();
      };
    });
    document.querySelectorAll('[data-pay-debt]').forEach(b=>{
      b.onclick = ()=>{
        const name = b.dataset.payDebt;
        const amt = customerDebtMap(data)[name] || 0;
        modalPayDebt(data, name, amt);
      };
    });

    const openEmployee = document.getElementById('openEmployeeModal');
    if(openEmployee) openEmployee.onclick = ()=>modalAddEmployee(data);
    const openExpense = document.getElementById('openExpenseModal');
    if(openExpense) openExpense.onclick = ()=>modalAddExpense(data);
    const openExpense2 = document.getElementById('openExpenseModal2');
    if(openExpense2) openExpense2.onclick = ()=>modalAddExpense(data);
    const btnCloseCash = document.getElementById('btnCloseCash');
    if(btnCloseCash) btnCloseCash.onclick = ()=>modalCloseCashRegister(data);

    /* ---- Incoming (Kirim) page bindings ---- */
    const btnNewIncoming = document.getElementById('btnNewIncoming');
    if(btnNewIncoming) btnNewIncoming.onclick = ()=>{
      incomingCart = [];
      incomingForm = { supplierId:'', destination:'warehouse', mode:'catalog', catalogProductId:'', newProductName:'',
        unit:'dona', costPrice:0, costCurrency:'uzs', sellPrice:0, sellCurrency:'uzs', rollSingle:'', bulkCount:'', bulkLen:'', simpleQty:1,
        stagedRolls:[], paymentType:'naqd', cashPaid:0, note:'', quickMode:false };
      render();
    };
    const btnQuickSupplier = document.getElementById('btnQuickSupplier');
    if(btnQuickSupplier) btnQuickSupplier.onclick = ()=>{ state.partnerTab='suppliers'; modalAddPartner(data); };
    const btnAddSupplierInline = document.getElementById('btnAddSupplierInline');
    if(btnAddSupplierInline) btnAddSupplierInline.onclick = ()=>{ state.partnerTab='suppliers'; modalAddPartner(data); };
    const incSupplier = document.getElementById('inc_supplier');
    if(incSupplier) incSupplier.onchange = ()=>{ incomingForm.supplierId = incSupplier.value; };
    document.querySelectorAll('.dest-btn').forEach(b=>{
      b.onclick = ()=>{ incomingForm.destination = b.dataset.dest; render(); };
    });
    const btnToggleNewProduct = document.getElementById('btnToggleNewProduct');
    if(btnToggleNewProduct) btnToggleNewProduct.onclick = ()=>{
      incomingForm.mode = incomingForm.mode==='catalog' ? 'new' : 'catalog';
      render();
    };
    const btnToggleQuickMode = document.getElementById('btnToggleQuickMode');
    if(btnToggleQuickMode) btnToggleQuickMode.onclick = ()=>{
      incomingForm.quickMode = !incomingForm.quickMode;
      render();
    };
    const incQuickNote = document.getElementById('inc_quicknote');
    if(incQuickNote) incQuickNote.oninput = ()=>{ incomingForm.newProductName = incQuickNote.value; };
    const incCatalog = document.getElementById('inc_catalog');
    if(incCatalog) incCatalog.onchange = ()=>{
      incomingForm.catalogProductId = incCatalog.value;
      const prod = data.products.find(p=>p.id===incCatalog.value);
      if(prod){ incomingForm.unit = prod.unit; }
      render();
    };
    const incNewname = document.getElementById('inc_newname');
    if(incNewname) incNewname.oninput = ()=>{ incomingForm.newProductName = incNewname.value; };
    const incUnit = document.getElementById('inc_unit');
    if(incUnit) incUnit.onchange = ()=>{ incomingForm.unit = incUnit.value; render(); };
    document.querySelectorAll('.curfield-btn').forEach(b=>{
      b.onclick = ()=>{
        if(b.dataset.curfield==='cost') incomingForm.costCurrency = b.dataset.cur;
        else incomingForm.sellCurrency = b.dataset.cur;
        render();
      };
    });
    const incCost = document.getElementById('inc_cost');
    if(incCost) incCost.oninput = ()=>{ incomingForm.costPrice = incCost.value; };
    const incRollSingle = document.getElementById('inc_roll_single');
    if(incRollSingle) incRollSingle.oninput = ()=>{ incomingForm.rollSingle = incRollSingle.value; };
    const btnAddSingleRoll = document.getElementById('btnAddSingleRoll');
    if(btnAddSingleRoll) btnAddSingleRoll.onclick = ()=>{
      const v = Number(document.getElementById('inc_roll_single').value);
      if(!v || v<=0) return;
      incomingForm.stagedRolls.push(v);
      incomingForm.rollSingle = '';
      render();
    };
    const incBulkCount = document.getElementById('inc_bulk_count');
    if(incBulkCount) incBulkCount.oninput = ()=>{ incomingForm.bulkCount = incBulkCount.value; };
    const incBulkLen = document.getElementById('inc_bulk_len');
    if(incBulkLen) incBulkLen.oninput = ()=>{ incomingForm.bulkLen = incBulkLen.value; };
    const btnAddBulkRolls = document.getElementById('btnAddBulkRolls');
    if(btnAddBulkRolls) btnAddBulkRolls.onclick = ()=>{
      const count = Number(document.getElementById('inc_bulk_count').value)||0;
      const len = Number(document.getElementById('inc_bulk_len').value)||0;
      if(count<=0 || len<=0) return toast(t('fill_all'));
      for(let i=0;i<count;i++) incomingForm.stagedRolls.push(len);
      incomingForm.bulkCount=''; incomingForm.bulkLen='';
      render();
    };
    document.querySelectorAll('[data-staged-del]').forEach(el=>{
      el.onclick = ()=>{ incomingForm.stagedRolls.splice(Number(el.dataset.stagedDel),1); render(); };
    });
    const incSimpleQty = document.getElementById('inc_simple_qty');
    if(incSimpleQty) incSimpleQty.oninput = ()=>{ incomingForm.simpleQty = incSimpleQty.value; };
    const btnAddIncomingItem = document.getElementById('btnAddIncomingItem');
    if(btnAddIncomingItem) btnAddIncomingItem.onclick = ()=>addIncomingItem(data);
    document.querySelectorAll('[data-inc-remove]').forEach(b=>{
      b.onclick = ()=>{ incomingCart.splice(Number(b.dataset.incRemove),1); render(); };
    });
    document.querySelectorAll('[data-pm]').forEach(b=>{
      b.onclick = ()=>{ incomingForm.paymentType = b.dataset.pm; render(); };
    });
    const incCashpaid = document.getElementById('inc_cashpaid');
    if(incCashpaid) incCashpaid.oninput = ()=>{ incomingForm.cashPaid = incCashpaid.value; render(); };
    const incNote = document.getElementById('inc_note');
    if(incNote) incNote.oninput = ()=>{ incomingForm.note = incNote.value; };
    const btnSaveIncoming = document.getElementById('btnSaveIncoming');
    if(btnSaveIncoming) btnSaveIncoming.onclick = ()=>finalizeIncoming(data);
    document.querySelectorAll('[data-supplier-pay]').forEach(b=>{
      b.onclick = ()=>modalSupplierPay(data, b.dataset.supplierPay);
    });

    const btnSaveSettings = document.getElementById('btnSaveSettings');
    if(btnSaveSettings) btnSaveSettings.onclick = async ()=>{
      data.telegramConfig = {
        token: document.getElementById('tg_token').value.trim(),
        chatId: document.getElementById('tg_chatid').value.trim(),
        enabled: document.getElementById('tg_enabled').checked
      };
      const ok = await saveCompanyData(state.session.companyId, data);
      if(!ok) return;
      toast(t('settings_saved'));
    };
    const btnOpenReceiptSettings = document.getElementById('btnOpenReceiptSettings');
    if(btnOpenReceiptSettings) btnOpenReceiptSettings.onclick = ()=>modalReceiptSettings(data);
    const btnDoUpdate = document.getElementById('btnDoUpdate');
    if(btnDoUpdate) btnDoUpdate.onclick = reloadForUpdate;
    const btnCheckUpdate = document.getElementById('btnCheckUpdate');
    if(btnCheckUpdate) btnCheckUpdate.onclick = ()=>checkForUpdate(true);
    const btnUploadLogo = document.getElementById('btnUploadLogo');
    if(btnUploadLogo) btnUploadLogo.onclick = ()=> document.getElementById('logoFile').click();
    const logoFile = document.getElementById('logoFile');
    if(logoFile) logoFile.onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const preview = document.getElementById('logoPreview');
      if(preview) preview.innerHTML = '⏳';
      const compressed = await compressImage(file, 192, 0.7);
      if(!compressed) return;
      data.settings = data.settings || {};
      data.settings.logo = compressed;
      const ok = await saveCompanyData(state.session.companyId, data);
      if(!ok) return;
      toast(t('saved')); render();
    };
    document.querySelectorAll('.visToggle').forEach(cb=>{
      cb.onchange = async ()=>{
        data.settings = data.settings || {};
        data.settings.hiddenNav = data.settings.hiddenNav || { admin:[], employee:[] };
        const role = cb.dataset.role, navId = cb.dataset.nav;
        const arr = data.settings.hiddenNav[role] || (data.settings.hiddenNav[role]=[]);
        if(cb.checked){ data.settings.hiddenNav[role] = arr.filter(x=>x!==navId); }
        else { if(!arr.includes(navId)) arr.push(navId); }
        await saveCompanyData(state.session.companyId, data);
      };
    });
    const btnResetAll = document.getElementById('btnResetAll');
    if(btnResetAll) btnResetAll.onclick = ()=>modalResetChoice(data);

    /* ---- Sales page bindings ---- */
    const sfCustomer = document.getElementById('sf_customer');
    if(sfCustomer) sfCustomer.oninput = ()=>{ saleForm.customer = sfCustomer.value; pushActiveCart(state.session.companyId); };
    const sfRegion = document.getElementById('sf_region');
    if(sfRegion) sfRegion.onchange = ()=>{ saleForm.region = sfRegion.value; pushActiveCart(state.session.companyId); };
    const sfPhone = document.getElementById('sf_phone');
    if(sfPhone) sfPhone.oninput = ()=>{ saleForm.phone = sfPhone.value; pushActiveCart(state.session.companyId); };
    const sfProductSearch = document.getElementById('sf_product_search');
    if(sfProductSearch){
      sfProductSearch.oninput = ()=>{ saleForm.productSearchQuery = sfProductSearch.value; render(); };
      setTimeout(()=>{ try{ sfProductSearch.focus(); sfProductSearch.selectionStart = sfProductSearch.value.length; }catch(e){} }, 0);
    }
    document.querySelectorAll('[data-pick-product]').forEach(el=>{
      el.onclick = ()=>{
        const prod = data.products.find(p=>p.id===el.dataset.pickProduct);
        if(!prod) return;
        saleForm.selProductId = prod.id;
        saleForm.productSearchQuery = '';
        saleForm.selRollId = (prod.rollMode && prod.rolls && prod.rolls[0]) ? prod.rolls[0].id : '';
        saleForm.sellMode = 'roll';
        saleForm.price = prod.price; saleForm.priceCurrency = prod.priceCurrency||"uzs";
        render();
      };
    });
    const sfProductChange = document.getElementById('sf_product_change');
    if(sfProductChange) sfProductChange.onclick = ()=>{
      saleForm.selProductId = ''; saleForm.productSearchQuery = '';
      render();
    };
    const sfRoll = document.getElementById('sf_roll');
    if(sfRoll) sfRoll.onchange = ()=>{ saleForm.selRollId = sfRoll.value; render(); };
    document.querySelectorAll('[data-sellmode]').forEach(b=>{
      b.onclick = ()=>{ saleForm.sellMode = b.dataset.sellmode; render(); };
    });
    const sfQty = document.getElementById('sf_qty');
    if(sfQty) sfQty.oninput = ()=>{ saleForm.qty = sfQty.value; };
    const sfBox = document.getElementById('sf_box');
    if(sfBox) sfBox.oninput = ()=>{ saleForm.box = sfBox.value; };
    const sfPrice = document.getElementById('sf_price');
    if(sfPrice) sfPrice.oninput = ()=>{ saleForm.price = sfPrice.value; };
    const sfPriceCur = document.getElementById('sf_price_cur');
    if(sfPriceCur) sfPriceCur.onchange = ()=>{ saleForm.priceCurrency = sfPriceCur.value; render(); };
    const btnAddCart = document.getElementById('btnAddCart');
    if(btnAddCart) btnAddCart.onclick = ()=>addToCart(data);
    const btnBarcode = document.getElementById('btnBarcode');
    if(btnBarcode) btnBarcode.onclick = ()=>{
      openBarcodeScanner((code)=>{
        const prod = data.products.find(p=>p.barcode===code);
        if(!prod) return toast(t('barcode_not_found'));
        saleForm.selProductId = prod.id;
        saleForm.selRollId = (prod.rollMode && prod.rolls && prod.rolls[0]) ? prod.rolls[0].id : '';
        saleForm.sellMode = 'roll';
        saleForm.price = prod.price; saleForm.priceCurrency = prod.priceCurrency||"uzs";
        toast(prod.name);
        render();
      });
    };
    document.querySelectorAll('[data-cart-remove]').forEach(b=>{
      b.onclick = ()=>{ saleCart.splice(Number(b.dataset.cartRemove),1); pushActiveCart(state.session.companyId); render(); };
    });
    const closeSaleForm = document.getElementById('closeSaleForm');
    if(closeSaleForm) closeSaleForm.onclick = ()=>{
      saleCart = []; saleForm = { customer:'', region:'Toshkent shahri', phone:'', selProductId:'', selRollId:'', sellMode:'roll', qty:1, box:1, price:0, payNaqd:0, payKarta:0, payNasiya:0 };
      clearActiveCart(state.session.companyId);
      state.page = 'dashboard';
      render();
    };
    const cartTotal = saleCart.reduce((s,i)=>s+i.total,0);
    document.querySelectorAll('[data-preset]').forEach(b=>{
      b.onclick = ()=>{
        const p = b.dataset.preset;
        if(p==='naqd'){ saleForm.payNaqd=cartTotal; saleForm.payKarta=0; saleForm.payNasiya=0; }
        else if(p==='karta'){ saleForm.payNaqd=0; saleForm.payKarta=cartTotal; saleForm.payNasiya=0; }
        else if(p==='split'){ saleForm.payNaqd=Math.round(cartTotal/2); saleForm.payKarta=cartTotal-Math.round(cartTotal/2); saleForm.payNasiya=0; }
        else if(p==='nasiya'){ saleForm.payNaqd=0; saleForm.payKarta=0; saleForm.payNasiya=cartTotal; }
        pushActiveCart(state.session.companyId);
        render();
      };
    });
    const payNaqd = document.getElementById('pay_naqd');
    if(payNaqd) payNaqd.oninput = ()=>{ saleForm.payNaqd = payNaqd.value; pushActiveCart(state.session.companyId); };
    const payKarta = document.getElementById('pay_karta');
    if(payKarta) payKarta.oninput = ()=>{ saleForm.payKarta = payKarta.value; pushActiveCart(state.session.companyId); };
    const payNasiya = document.getElementById('pay_nasiya');
    if(payNasiya) payNasiya.oninput = ()=>{ saleForm.payNasiya = payNasiya.value; pushActiveCart(state.session.companyId); };
    const btnSaveSale = document.getElementById('btnSaveSale');
    if(btnSaveSale) btnSaveSale.onclick = ()=>finalizeSale(data);
    const sfSearch = document.getElementById('sf_search');
    if(sfSearch) sfSearch.oninput = ()=>{ saleSearch = sfSearch.value; render(); };
    document.querySelectorAll('[data-return-sale]').forEach(b=>{
      b.onclick = ()=>returnSale(data, b.dataset.returnSale);
    });
    document.querySelectorAll('[data-print-sale]').forEach(b=>{
      b.onclick = ()=>printReceipt(data, b.dataset.printSale);
    });

    document.querySelectorAll('[data-view-product]').forEach(b=>{
      b.onclick = ()=>modalViewProduct(data, b.dataset.viewProduct);
    });
    document.querySelectorAll('[data-print-barcode]').forEach(b=>{
      b.onclick = ()=>modalPrintBarcode(data, b.dataset.printBarcode);
    });
    document.querySelectorAll('[data-del-product]').forEach(b=>{
      b.onclick = async ()=>{ data.products = data.products.filter(p=>p.id!==b.dataset.delProduct); await saveCompanyData(state.session.companyId,data); toast(t('deleted')); render(); };
    });
    document.querySelectorAll('[data-del-partner]').forEach(b=>{
      b.onclick = async ()=>{ data.partners = data.partners.filter(p=>p.id!==b.dataset.delPartner); await saveCompanyData(state.session.companyId,data); toast(t('deleted')); render(); };
    });
    document.querySelectorAll('[data-del-employee]').forEach(b=>{
      b.onclick = async ()=>{
        data.employees = data.employees.filter(e=>e.username!==b.dataset.delEmployee);
        await sDel('user:'+b.dataset.delEmployee, true);
        await saveCompanyData(state.session.companyId,data); toast(t('deleted')); render();
      };
    });
    document.querySelectorAll('[data-del-expense]').forEach(b=>{
      b.onclick = async ()=>{
        data.expenses = (data.expenses||[]).filter(e=>e.id!==b.dataset.delExpense);
        await saveCompanyData(state.session.companyId,data); toast(t('deleted')); render();
      };
    });
    
  }
}

/* ============ INIT ============ */
(async function init(){
  await window.__sbReadyPromise;
  await tryRestoreSession();
  render();
  checkForUpdate();
  setInterval(checkForUpdate, 5*60*1000); // har 5 daqiqada tekshirib turadi
})();
</script>
